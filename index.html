                      ← Volver a MoneyPilot
                    </button>
                  </div>
                  <SelectorCalculadora onRecomendar={(modo)=>{
                    setModoRecomendado(modo);
                    requestAnimationFrame(()=>{
                      document.getElementById('calculadora-iframe')?.scrollIntoView({behavior:'smooth', block:'start'});
                    });
                  }}/>
                  <iframe
                    id="calculadora-iframe"
                    key={modoRecomendado}
                    title="Prueba nuestras calculadoras"
                    srcDoc={CALCULADORA_DOCUMENTO.replace('"__MODO_INICIAL__"', JSON.stringify(modoRecomendado||""))}
                    style={{
                      width:"100%",
                      height:alturaCalculadora+"px",
                      border:"0",
                      display:"block",
                      background:"#f5f6fa",
                      transition:"height 150ms ease"
                    }}
                  />
                </div>
              </section>
            </div>
          )}

          {vistaActual==='blog' && (
            <div key="blog" className="fade-switch-enter">
              <Blog user={user}/>
            </div>
          )}

          {vistaActual==='privacidad' && (
            <div key="privacidad" className="fade-switch-enter">
              <PaginaLegal titulo="Política de Privacidad">
                <p><b>1. Responsable del tratamiento.</b> Óscar Baca Martínez, particular residente en España, con contacto en soportemoneypilot@gmail.com, es el responsable de los datos tratados a través de MoneyPilot.</p>
                <p><b>2. Datos que recogemos.</b> Los datos financieros que introduces voluntariamente en la herramienta (ingresos, gastos, ahorros) se usan únicamente para generar tu diagnóstico, además de datos técnicos de navegación (dirección IP, tipo de dispositivo, páginas visitadas) recogidos de forma automática.</p>
                <p><b>3. Cookies y publicidad.</b> Este sitio utiliza cookies propias y de terceros, incluyendo Google AdSense, para mostrar anuncios personalizados según tus intereses. Google, como proveedor externo, utiliza cookies para publicar anuncios basados en tus visitas anteriores a este sitio o a otros sitios web. Puedes inhabilitar el uso de cookies de personalización de anuncios visitando la <a href="https://adssettings.google.com" target="_blank" rel="noopener" style={{color:C.sand,textDecoration:"underline"}}>Configuración de anuncios de Google</a>.</p>
                <p><b>4. Finalidad del tratamiento.</b> Los datos se usan para prestar el servicio solicitado, mejorar la experiencia de usuario y, en su caso, mostrar publicidad relevante a través de terceros como Google AdSense.</p>
                <p><b>5. Conservación de los datos.</b> Los datos financieros que introduces se guardan en tu dispositivo y, si creas una cuenta, en la nube, únicamente mientras mantengas tu cuenta activa o decidas borrarlos tú mismo desde la propia aplicación.</p>
                <p><b>6. Derechos del usuario.</b> Puedes ejercer tus derechos de acceso, rectificación, supresión, oposición y portabilidad escribiendo a soportemoneypilot@gmail.com.</p>
                <p><b>7. Cambios en esta política.</b> Esta política puede actualizarse para adaptarse a cambios legales o del servicio. Recomendamos revisarla periódicamente.</p>
              </PaginaLegal>
            </div>
          )}

          {vistaActual==='aviso-legal' && (
            <div key="aviso-legal" className="fade-switch-enter">
              <PaginaLegal titulo="Aviso Legal y Términos de Uso">
                <p><b>1. Titular.</b> MoneyPilot es un proyecto operado por Óscar Baca Martínez, particular residente en España, contacto: soportemoneypilot@gmail.com.</p>
                <p><b>2. Objeto.</b> MoneyPilot es una herramienta informativa de educación financiera que permite analizar de forma orientativa la situación económica personal introducida por el usuario. No sustituye el asesoramiento de un profesional financiero, fiscal o legal.</p>
                <p><b>3. Ausencia de asesoramiento financiero.</b> Los resultados, diagnósticos y recomendaciones generados por MoneyPilot son orientativos y educativos. No constituyen recomendación de inversión ni asesoramiento financiero personalizado bajo ninguna normativa. El usuario es el único responsable de las decisiones económicas que tome.</p>
                <p><b>4. Propiedad intelectual.</b> Los contenidos, textos, diseño y código de esta web son propiedad de MoneyPilot salvo que se indique lo contrario, y no pueden reproducirse sin autorización.</p>
                <p><b>5. Publicidad.</b> Esta web puede mostrar anuncios de terceros, incluido Google AdSense, para financiar el servicio gratuito.</p>
                <p><b>6. Legislación aplicable.</b> Este aviso legal se rige por la legislación española.</p>
              </PaginaLegal>
            </div>
          )}

          {vistaActual==='quienes-somos' && (
            <div key="quienes-somos" className="fade-switch-enter">
              <PaginaLegal titulo="Quiénes somos">
                <p>Detrás de MoneyPilot hay un proyecto nacido de una realidad muy común: la falta de educación financiera genera estrés crónico y decisiones equivocadas. Somos desarrolladores y entusiastas de las finanzas personales que creemos firmemente que la tecnología debe servir para democratizar el bienestar económico.</p>
                <p>MoneyPilot está creado y mantenido por Óscar Baca Martínez, estudiante de Economía y apasionado de los mercados financieros, con más de 2 años gestionando su propia cartera en acciones y otros productos financieros.</p>
                <p><b>Cuál es nuestro objetivo.</b> Nuestro propósito no es darte una simple hoja de cálculo matemática, sino educar, dar contexto y crear un plan de acción. Queremos ayudarte a:</p>
                <ul style={{listStyle:"disc",paddingLeft:"1.4rem"}}>
                  <li><b>Comprar tranquilidad:</b> construyendo un escudo contra los imprevistos para blindar a tu familia y reducir tu ansiedad.</li>
                  <li><b>Salir de las deudas:</b> trazando planes exactos (como la bola de nieve o la avalancha) para que recuperes tu margen mensual.</li>
                  <li><b>Poner el tiempo a tu favor:</b> demostrando con datos reales cómo el interés compuesto y las decisiones tempranas pueden multiplicar tu patrimonio sin que sientas que sacrificas tu calidad de vida actual.</li>
                </ul>
                <p>En definitiva, nuestro objetivo es acompañarte para que dejes de sobrevivir a fin de mes y empieces a diseñar tu libertad financiera.</p>
                <p>Puedes escribirnos a <a href="mailto:soportemoneypilot@gmail.com" style={{color:C.sand,textDecoration:"underline"}}>soportemoneypilot@gmail.com</a> para cualquier duda, sugerencia o colaboración.</p>
              </PaginaLegal>
            </div>
          )}

          {vistaActual==='contacto' && (
            <div key="contacto" className="fade-switch-enter">
              <Contacto/>
            </div>
          )}

        </main>

        {showFooterNotice && (
          <footer className="relative z-10 border-t no-print" style={{borderColor:C.border,backgroundColor:C.paper}}>
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
              <p className="text-xs" style={{color:C.muted}}>Recuerda: puedes evaluar esta página de forma <b style={{color:C.ink}}>anónima</b>. Tu opinión nos ayuda a mejorar y la agradecemos de verdad.</p>
              <div className="flex items-center gap-2 shrink-0">
                <button onClick={()=>setShowFeedbackModal(true)} className="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-lg shrink-0" style={{backgroundColor:C.sand,color:C.white}}>Evaluar página</button>
                <button onClick={()=>setShowFooterNotice(false)} aria-label="Cerrar aviso" className="w-7 h-7 rounded-lg flex items-center justify-center hover:bg-black/5 shrink-0" style={{color:C.muted}}><I.x size={14}/></button>
              </div>
            </div>
          </footer>
        )}

        <footer className="relative z-10 border-t no-print" style={{borderColor:C.border,backgroundColor:C.paper}}>
          <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left text-xs" style={{color:C.mutedLight}}>
            <span>© {new Date().getFullYear()} MoneyPilot</span>
            <div className="flex flex-wrap items-center justify-center gap-4">
              <button onClick={()=>setVistaActual('blog')} className="hover:underline" style={{color:C.mutedLight}}>Blog</button>
              <button onClick={()=>setVistaActual('privacidad')} className="hover:underline" style={{color:C.mutedLight}}>Política de Privacidad</button>
              <button onClick={()=>setVistaActual('aviso-legal')} className="hover:underline" style={{color:C.mutedLight}}>Aviso Legal</button>
              <button onClick={()=>setVistaActual('quienes-somos')} className="hover:underline" style={{color:C.mutedLight}}>Quiénes somos</button>
              <button onClick={()=>setVistaActual('contacto')} className="hover:underline" style={{color:C.mutedLight}}>Contacto</button>
            </div>
          </div>
        </footer>

        {showAuthModal && <AuthModal onClose={()=>setShowAuthModal(false)} onAuthSuccess={()=>{setShowAuthModal(false);showToast("Sesión iniciada")}} signUp={signUp} signIn={signIn}/>}
        {showFeedbackModal && <FeedbackModal onClose={()=>setShowFeedbackModal(false)}/>}
        <Toast toast={toast}/>
      </div>
      <PrintSummary datos={datos} perfil={perfil} gastoTotal={gastoTotal} ahorroDisponible={ahorroDisponible} ratioAhorro={ratioAhorro}/>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
