<title>MoneyPilot</title>

<style>
  html, body { overflow-x: hidden; max-width: 100%; }
  body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; }
  .font-serif { font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  @keyframes fadeSwitchIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .fade-switch-enter { animation: fadeSwitchIn 200ms ease; }
  @keyframes staggerIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .stagger-item { animation: staggerIn 380ms cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes toastIn { from { opacity:0; transform:translateY(8px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }
  .toast-enter { animation: toastIn 220ms cubic-bezier(0.16,1,0.3,1); }

  .glass-nav { backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }

  /* Toda caja con borde (clase .border de Tailwind) recibe un halo dorado luminoso
     y un degradado de fondo marcado, en vez de un borde plano y un color liso. */
  .border {
    box-shadow: 0 1px 3px rgba(30,30,46,0.05), 0 8px 24px rgba(30,30,46,0.05);
    background-image:none;
    transition: box-shadow 250ms ease, border-color 250ms ease;
  }
  .border:hover { border-color: rgba(79,70,229,0.45); box-shadow: 0 4px 16px rgba(79,70,229,0.12); }

  /* Foco accesible consistente en toda la app, sin depender de los estilos inline por color */
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid #4F46E5;
    outline-offset: 2px;
    border-radius: 4px;
  }
  input, select { transition: border-color 200ms ease, box-shadow 200ms ease; }
  input:focus, select:focus { border-color: #4F46E5 !important; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }

  /* Exportación a PDF: se usa la impresión nativa del navegador (Guardar como PDF).
     Ocultamos la app y mostramos solo el resumen imprimible, con colores legibles en papel. */
  .print-only { display: none; }
  @media print {
    .no-print { display: none !important; }
    .print-only { display: block !important; }
    body { background: #fff !important; }
  }

  /* Ajustes de legibilidad: menos saturación y sin destellos */
  .text-indigo-600, .text-indigo-700 { color:#4338CA !important; }
  .bg-indigo-600 { background-color:#4F46E5 !important; }
  .bg-indigo-700 { background-color:#4338CA !important; }
  .hover\:bg-indigo-700:hover { background-color:#4338CA !important; }
  .shadow-lg, .shadow-xl { box-shadow:0 8px 24px rgba(30,30,46,.08) !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; } }
</style>

<style id="readability-overrides">
  .readable-hero-copy{
    color:#334155 !important;
    background:rgba(255,255,255,.62);
    border:1px solid rgba(79,70,229,.16);
    border-left:4px solid #4F46E5;
    border-radius:14px;
    padding:14px 18px;
    box-shadow:0 8px 22px rgba(49,46,129,.07);
    text-shadow:none;
  }
  .readable-section-subtitle{
    display:inline-block;
    color:#374151 !important;
    background:#eef0ff;
    border:1px solid rgba(79,70,229,.18);
    border-radius:10px;
    padding:7px 11px;
    line-height:1.55;
    box-shadow:0 3px 10px rgba(49,46,129,.05);
    text-shadow:none;
  }
</style>

<style id="harmonized-theme">
:root{
 --bg:#f5f6fa; --surface:#fbfcff; --surface-soft:#f1f3f9;
 --primary:#4f46e5; --primary-dark:#3730a3; --primary-soft:#eef0ff;
 --green:#10b981; --green-soft:#eafaf4;
 --blue:#0ea5e9; --blue-soft:#eaf7fd;
 --amber:#f59e0b; --amber-soft:#fff7e6;
 --danger:#ef4444; --danger-soft:#fff0f0;
 --text:#374151; --text-strong:#312e81; --muted:#6b7280; --border:#e4e7ef;
}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#f1f3f9 0%,#f5f6fa 22%,#f8f9fc 52%,#f3f5fa 78%,#eef1f8 100%) !important;color:var(--text)!important}
section{background:transparent}
section:nth-of-type(odd){background:linear-gradient(180deg,rgba(238,240,255,.30),rgba(245,246,250,.05))}
section:nth-of-type(even){background:linear-gradient(180deg,rgba(234,250,244,.14),rgba(245,246,250,.03))}

.bg-white{background:rgba(251,252,255,.90)!important}
.bg-gray-50{background:rgba(241,243,249,.72)!important}
.bg-indigo-50{background:var(--primary-soft)!important}
.bg-green-50{background:var(--green-soft)!important}
.bg-blue-50{background:var(--blue-soft)!important}
.bg-yellow-50{background:var(--amber-soft)!important}
.bg-red-50{background:var(--danger-soft)!important}

h1,h2,h3,h4,h5,h6,.font-bold,.font-extrabold{color:var(--text-strong)}
.text-gray-900{color:#312e81!important}
.text-gray-800{color:#374151!important}
.text-gray-700{color:#4b5563!important}
.text-gray-600{color:#6b7280!important}

.text-indigo-600{color:#4f46e5!important}
.text-indigo-700{color:#4338ca!important}
.text-green-600{color:#059669!important}
.text-green-700{color:#047857!important}

.border-gray-200,.border-gray-300{border-color:var(--border)!important}
.shadow,.shadow-sm,.shadow-md,.shadow-lg,.shadow-xl{box-shadow:0 8px 24px rgba(49,46,129,.07)!important}
.rounded-xl,.rounded-2xl,.rounded-3xl{border-color:rgba(228,231,239,.82)}

.ring-indigo-500{--tw-ring-color:rgba(79,70,229,.25)!important}
.focus\:ring-indigo-500:focus{--tw-ring-color:rgba(79,70,229,.25)!important}

.hero,.hero-section{background:linear-gradient(135deg,rgba(238,240,255,.72) 0%,rgba(251,252,255,.62) 48%,rgba(234,250,244,.34) 100%)!important}

.chart-container,.chart-card,.progress-card{background:rgba(248,249,252,.76)!important;border:1px solid var(--border)!important}

input,select,textarea{background:rgba(255,255,255,.78)!important;border-color:#dfe3ec!important;color:#374151!important}
input::placeholder,textarea::placeholder{color:#9ca3af!important}

.bg-white\/90{background:rgba(251,252,255,.90)!important}
.bg-white\/80{background:rgba(251,252,255,.80)!important}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}}

section.section-tinted{
  background:
    radial-gradient(700px 260px at 8% 0%, rgba(79,70,229,.055), transparent 70%),
    linear-gradient(180deg, rgba(238,240,255,.38) 0%, rgba(245,246,250,.12) 48%, rgba(234,250,244,.16) 100%) !important;
}
.section-intro{
  position:relative;
  padding:1.35rem 1.5rem 1.4rem;
  border:1px solid rgba(79,70,229,.12);
  border-radius:1.25rem;
  background:rgba(248,249,253,.88);
  box-shadow:0 10px 30px rgba(49,46,129,.07);
}
.section-intro h1,.section-intro h2,.section-intro h3{
  color:#312e81 !important;
  text-shadow:0 1px 0 rgba(255,255,255,.8);
}
.section-intro p{
  color:#4b5563 !important;
}
.section-intro:after{
  content:"";
  position:absolute;
  left:1.5rem; top:0; width:56px; height:3px;
  border-radius:999px; background:#4f46e5; opacity:.75;
}
#introduccion h1{color:#312e81 !important;text-shadow:0 1px 0 rgba(255,255,255,.72)}
#introduccion p{color:#4b5563 !important}
@media(max-width:640px){.section-intro{padding:1.1rem 1.1rem 1.15rem}.section-intro:after{left:1.1rem}}

.quick-view-heading{background:linear-gradient(180deg,#F8FAFC,#F1F3F9);border:1px solid #E2E8F0;border-radius:12px;padding:.65rem .75rem;margin:-.15rem -.15rem .1rem;box-shadow:0 4px 12px rgba(49,46,129,.04)}

.readable-title{
  display:inline-block;
  color:#312E81 !important;
  background:linear-gradient(180deg,#F8F8FF 0%,#EEF0FF 100%);
  border:1px solid rgba(79,70,229,.16);
  border-left:4px solid #4F46E5;
  border-radius:12px;
  padding:.48rem .8rem;
  box-shadow:0 5px 16px rgba(49,46,129,.07);
  text-shadow:none !important;
}
.readable-subtitle{color:#475569 !important;}
.readable-note{
  color:#475569 !important;
  background:#F8FAFC;
  border:1px solid #E2E8F0;
  border-left:3px solid #4F46E5;
  border-radius:10px;
  padding:.55rem .75rem;
  line-height:1.55;
}
.readable-callout{
  background:linear-gradient(135deg,#F5F3FF 0%,#EEF2FF 100%) !important;
  color:#334155 !important;
  border:1px solid rgba(79,70,229,.15);
  box-shadow:0 6px 18px rgba(49,46,129,.06);
}
.hero-description{color:#FFFFFF !important;line-height:1.75;max-width:42rem;}
.quiz-question{
  color:#312E81 !important;
  background:linear-gradient(135deg,#F8F8FF,#EEF0FF);
  border:1px solid rgba(79,70,229,.14);
  border-radius:12px;
  padding:.75rem .9rem;
  margin-bottom:.7rem;
  box-shadow:0 4px 14px rgba(49,46,129,.05);
}
.quiz-note{
  color:#475569 !important;
  background:#F8FAFC !important;
  border:1px solid #E2E8F0;
  border-left:3px solid #0EA5E9;
  border-radius:9px;
  padding:.55rem .75rem;
}
.quiz-option{
  width:100%; text-align:left; padding:.78rem 1rem; border-radius:12px;
  border:1px solid #DDE3EC !important; background:#F9FAFC !important;
  color:#334155 !important; font-weight:600;
  display:flex; align-items:center; justify-content:space-between;
  transition:all 180ms ease;
}
.quiz-option:hover{border-color:rgba(79,70,229,.38)!important;background:#F2F4FF!important;transform:translateX(2px);box-shadow:0 4px 12px rgba(79,70,229,.07)}
.chart-interactive{cursor:crosshair}
.chart-interactive svg text{user-select:none}
</style>

<style id="final-contrast-fix">
.hero-contrast-text, .readable-note, .readable-subtitle {
  color:#1f2937 !important;
  background:#ffffff !important;
  border:1px solid #d9def0 !important;
  border-left:5px solid #4f46e5 !important;
  border-radius:14px !important;
  padding:14px 18px !important;
  box-shadow:0 4px 14px rgba(49,46,129,.10) !important;
}
.readable-subtitle { border-left:4px solid #4f46e5 !important; padding:10px 14px !important; display:inline-block; }
.readable-note { border-left-color:#10b981 !important; }
</style>

<style id="phase1-contrast-fixes">
/* FASE 1 — Auditoría de contraste WCAG AA */
.hero-description{
  color:#334155 !important;
  text-shadow:none;
}
.cta-highlight-title{ color:#1E1B4B !important; }
.cta-highlight-sub{ color:#4B5563 !important; }
.nav-link-muted{ color:#94A3B8 !important; transition:color 250ms ease; }
.nav-link-muted:hover{ color:#E2E8F0 !important; }
.nav-menu-text{ color:#CBD5E1 !important; transition:color 250ms ease; }
.nav-menu-text:hover{ color:#FFFFFF !important; }
.export-menu{ transform-origin: top right; animation: menuPop 200ms cubic-bezier(0.16,1,0.3,1); }
@keyframes menuPop{ from{ opacity:0; transform:scale(0.94) translateY(-4px); } to{ opacity:1; transform:scale(1) translateY(0); } }
</style>

   pero estas variables documentan la paleta final y quedan listas para cualquier
   CSS nuevo que se añada en fases futuras. */
:root{
  --brand-deep:#312E81;     /* texto de marca, cabeceras, iconografía oscura */
  --brand-primary:#4F46E5;  /* acciones principales — antes nombrado "sand" en el JS histórico */
  --brand-growth:#10B981;   /* ahorro, positivo */
  --brand-caution:#F59E0B;  /* mejorable */
  --brand-alert:#EF4444;    /* crítico */
  --surface-0:#F5F6FA;      /* fondo base de la app */
  --surface-1:#FFFFFF;      /* tarjetas */
  --text-strong:#1E1B4B;
  --text-body:#374151;
  --text-muted:#6B7280;
}
</style>
</head>

      <path d={path} />
    </svg>
  );
}

/* ============================================================
   MOTOR ADAPTATIVO DEL CUESTIONARIO
   ------------------------------------------------------------
   Cada pregunta tiene un ID estable. El siguiente paso depende
   de las respuestas ya dadas y de los datos financieros existentes.
   ============================================================ */
function quizNumero(respuestas,id){
  const n=Number((respuestas||{})[id]);
  const max=(QUIZ_DEF[id]?.opciones||[]).length || 4;
  return n>=1 && n<=max ? n : null;
}

function tipoObjetivoDesdeQuiz(valor){
  return ({1:"casa",2:"coche",3:"vacaciones",4:"estudios",5:"libertad",6:"poder_adquisitivo",7:"otro"})[Number(valor)] || null;
}
function esObjetivoMaterial(datos={},tipoQuiz=null){
  const tipo=tipoObjetivoDesdeQuiz(tipoQuiz)||datos?.objetivo?.tipo;
  return ["casa","coche","vacaciones","estudios"].includes(tipo);
}

function getNextQuestionId(currentQuestionId, respuestas={}, datos={}){
  const r=respuestas||{};
  const h=quizNumero(r,"horizonte");
  const l=quizNumero(r,"liquidez");
  const p=quizNumero(r,"conocimientoProductos");
  const k=quizNumero(r,"conocimientoRiesgo");
  const objetivoRiesgo=quizNumero(r,"objetivo");
  const objetivoTipo=tipoObjetivoDesdeQuiz(r.objetivoTipo)||datos?.objetivo?.tipo;
  const necesitaLiquidez = (h!=null && h<=2) || (l!=null && l<=2);
  const material = esObjetivoMaterial(datos,r.objetivoTipo);

  switch(currentQuestionId){
    case null:
    case undefined:
      return "edad";
    case "edad":
      return "disposicionInvertir";
    case "disposicionInvertir":
      return "conocimientoProductos";
    case "conocimientoProductos":
      return "objetivo";
    case "objetivo":
      return "objetivoTipo";
    case "objetivoTipo":
      return "horizonte";
    case "horizonte":
      return "estabilidad";
    case "estabilidad":
      return "concentracion";
    case "concentracion":
      return "liquidez";
    case "liquidez":
      return necesitaLiquidez ? "liquidezDetalle" : "caida";
    case "liquidezDetalle":
      return "colchonAlternativo";
    case "colchonAlternativo":
      return "caida";
    case "caida":
      if(["libertad","poder_adquisitivo"].includes(objetivoTipo)) return "objetivoLargoPlazo";
      return (material || objetivoRiesgo<=2 || objetivoTipo==="otro") ? "objetivoContexto" : ((h!=null && h>=3) ? "perdida" : (p!=null && p<=1 ? "patrimonio" : "conocimientoRiesgo"));
    case "objetivoContexto":
      return (h!=null && h>=3) ? "perdida" : (p!=null && p<=1 ? "patrimonio" : "conocimientoRiesgo");
    case "objetivoLargoPlazo":
      return (h!=null && h>=3) ? "perdida" : (p!=null && p<=1 ? "patrimonio" : "conocimientoRiesgo");
    case "perdida":
      return p!=null && p<=1 ? "patrimonio" : "conocimientoRiesgo";
    case "conocimientoRiesgo":
      return k!=null && k>=3 ? "conocimientoCostes" : "patrimonio";
    case "conocimientoCostes":
      return p!=null && p>=3 ? "comportamiento" : "patrimonio";
    case "comportamiento":
      return "patrimonio";
    case "patrimonio":
    default:
      return null;
  }
}

function construirRutaQuiz(respuestas={}, datos={}){
  const r=normalizarRespuestasQuiz(respuestas);
  const ruta=[];
  let id=getNextQuestionId(null,r,datos);
  const vistos=new Set();
  while(id && !vistos.has(id) && ruta.length<30){
    vistos.add(id);
    ruta.push(id);
    if(quizNumero(r,id)==null) break;
    id=getNextQuestionId(id,r,datos);
  }
  return ruta;
}

function preguntasDisponiblesQuiz(respuestas={}, datos={}){
  return construirRutaQuiz(respuestas,datos).map(id=>QUIZ_DEF[id]).filter(Boolean);
}

function reconstruirEstadoQuiz(quizState, datos={}){
  const estado=quizState && typeof quizState==="object" ? quizState : {};
  const respuestas=normalizarRespuestasQuiz(estado.respuestas || {});
  const rutaGuardada=Array.isArray(estado.questionPath) ? estado.questionPath.filter(id=>QUIZ_DEF[id]) : [];
  const rutaCalculada=construirRutaQuiz(respuestas,datos);
  const ruta=rutaGuardada.length ? rutaGuardada.filter((id,i)=>rutaCalculada[i]===id) : rutaCalculada;
  const rutaFinal=ruta.length ? ruta : rutaCalculada;
  const ultimo=rutaFinal[rutaFinal.length-1];
  const finalizado=!!estado.terminado || (ultimo==="patrimonio" && quizNumero(respuestas,"patrimonio")!=null);
  const candidato=estado.currentQuestionId && QUIZ_DEF[estado.currentQuestionId] ? estado.currentQuestionId : null;
  const actual=finalizado
    ? (ultimo || "patrimonio")
    : (candidato && rutaFinal.includes(candidato)
        ? candidato
        : (rutaFinal.find(id=>quizNumero(respuestas,id)==null) || ultimo || "edad"));
  return {
    respuestas,
    currentQuestionId: actual,
    questionPath: rutaFinal,
    paso: Math.max(0,rutaFinal.indexOf(actual)),
    terminado: finalizado,
    resultado: estado.resultado || null
  };
}

/* Compatibilidad con estados antiguos basados en array + paso. */
function normalizarRespuestasQuiz(respuestas){
  if(!Array.isArray(respuestas)) return respuestas || {};
  const legacyIds=["edad","horizonte","objetivo","estabilidad","concentracion","liquidez","caida","conocimientoProductos"];
  const out={};
  respuestas.forEach((valor,i)=>{ if(valor!=null && legacyIds[i]) out[legacyIds[i]]=Number(valor); });
  return out;
}

   PERFIL DE RIESGO MULTIDIMENSIONAL
   ============================================================ */
const PERFILES_NIVELES = ["Muy conservador","Conservador","Moderado","Agresivo","Muy agresivo"];

function calcularPerfilMultidimensional(respuestas, datos={}){
  const r=normalizarRespuestasQuiz(respuestas);
  const valor = id => quizNumero(r,id);
  const media = (items) => {
    const validos=items.filter(v=>v!=null && !isNaN(v));
    return validos.length ? validos.reduce((a,b)=>a+b,0)/validos.length : null;
  };
  const a100 = v => v==null ? null : Math.round(v*25);

  const qEdad=valor("edad");
  const qHorizonte=valor("horizonte");
  const qObjetivo=valor("objetivo");
  const qObjetivoTipo=valor("objetivoTipo");
  const qEstabilidad=valor("estabilidad");
  const qConcentracion=valor("concentracion");
  const qLiquidez=valor("liquidez");
  const qLiquidezDetalle=valor("liquidezDetalle");
  const qColchonAlternativo=valor("colchonAlternativo");
  const qCaida=valor("caida");
  const qPerdida=valor("perdida");
  const qObjetivoContexto=valor("objetivoContexto");
  const qObjetivoLargoPlazo=valor("objetivoLargoPlazo");
  const qProductos=valor("conocimientoProductos");
  const qRiesgo=valor("conocimientoRiesgo");
  const qCostes=valor("conocimientoCostes");
  const qComportamiento=valor("comportamiento");
  const qPatrimonio=valor("patrimonio");

  const ahorroActual=Number(datos.ahorroActual||0);
  const capacidadFinanciera=calcularCapacidadFinanciera(datos);
  const ahorroDisponible=capacidadFinanciera.capacidadMensual;
  const gastoTotal=capacidadFinanciera.gastosTotales;
  const coberturaEmergencia=capacidadFinanciera.gastosTotales>0 ? ahorroActual/capacidadFinanciera.gastosTotales : null;
  const ratioDeuda=capacidadFinanciera.ingresos>0 ? capacidadFinanciera.cuotasDeuda/capacidadFinanciera.ingresos : null;
  const deudaPendiente=(datos.deudas||[]).reduce((s,d)=>s+Number(d.pendiente||0),0);
  const planObjetivos=calcularPlanObjetivos(datos);
  const objetivosPlan=planObjetivos.objetivos;
  const objetivoPrincipalPlan=planObjetivos.principal;
  const objetivoContextualTipo=(objetivoPrincipalPlan?.tipo)||tipoObjetivoDesdeQuiz(qObjetivoTipo)||null;
  const importeObjetivo=Number(objetivoPrincipalPlan?.importeObjetivo || 0);
  const plazoObjetivo=Number(objetivoPrincipalPlan?.plazoAnios || 0);
  const reservadoObjetivo=Number(objetivoPrincipalPlan?.importeReservado || 0);
  const coberturaObjetivo=importeObjetivo>0 ? Math.max(0,Math.min(1,reservadoObjetivo/importeObjetivo)) : null;

  /*
   * Edad es contexto independiente. Un usuario joven no obtiene por ello
   * un horizonte largo: el horizonte se deriva exclusivamente de su respuesta.
   */
  const edad=a100(qEdad);
  const horizonte=a100(qHorizonte);
  const toleranciaRiesgo=a100(media([qCaida,qPerdida,qObjetivo,qObjetivoContexto,qObjetivoLargoPlazo]));

  /*
   * Capacidad: incorpora situación financiera real y las nuevas preguntas
   * condicionales de liquidez. Si no hay datos financieros, se usan solo las
   * respuestas disponibles y la confianza lo refleja.
   */
  const factorFlujo=Number(datos.ingresos||0)>0
    ? (ahorroDisponible>0 ? Math.min(4,1+ahorroDisponible/Math.max(Number(datos.ingresos||1)*0.25,1)) : 1)
    : null;
  const factorEmergencia=coberturaEmergencia==null ? null : (coberturaEmergencia<1?1:coberturaEmergencia<3?2:coberturaEmergencia<6?3:4);
  const factorDeuda=ratioDeuda==null ? null : (ratioDeuda>0.40?1:ratioDeuda>0.25?2:ratioDeuda>0.10?3:4);
  const factoresFinancierosDuros=[factorFlujo,factorEmergencia,factorDeuda].filter(v=>v!=null);
  const capacidadFactores=[
    qEstabilidad,
    qConcentracion,
    qPatrimonio,
    coberturaObjetivo==null ? null : (coberturaObjetivo<0.25?1:coberturaObjetivo<0.50?2:coberturaObjetivo<0.75?3:4),
    qLiquidezDetalle,
    qColchonAlternativo
  ];
  const capacidadEncuesta=media(capacidadFactores);
  const capacidadDura=factoresFinancierosDuros.length ? Math.min(...factoresFinancierosDuros) : null;
  const capacidadRiesgo=a100(capacidadDura==null ? capacidadEncuesta : Math.min(capacidadEncuesta==null?capacidadDura:capacidadEncuesta,capacidadDura));

  /* Liquidez ya NO incorpora matemáticamente el horizonte. Son dimensiones distintas. */
  const liquidez=a100(qLiquidez);
  const experiencia=a100(media([qProductos,qRiesgo,qCostes,qComportamiento]));

  const dimensiones={edad,toleranciaRiesgo,capacidadRiesgo,horizonte,liquidez,experiencia};
  const pesos={toleranciaRiesgo:0.30,capacidadRiesgo:0.30,horizonte:0.15,liquidez:0.15,experiencia:0.10};
  const dimensionesPonderadas=Object.fromEntries(Object.entries(pesos).map(([key,peso])=>[key,{valor:dimensiones[key],peso}]));
  const paresConocidos=Object.entries(pesos).filter(([key])=>dimensiones[key]!=null);
  const pesoConocido=paresConocidos.reduce((s,[,peso])=>s+peso,0);
  const baseScore=pesoConocido>0
    ? Math.round(paresConocidos.reduce((s,[key,peso])=>s+dimensiones[key]*peso,0)/pesoConocido)
    : 0;

  const nivelPorScore = score => score<30 ? 0 : score<45 ? 1 : score<60 ? 2 : score<80 ? 3 : 4;
  let nivelFinal=nivelPorScore(baseScore);

  /*
   * La puntuación agregada orienta, pero nunca puede compensar una debilidad
   * crítica. Cada dimensión limitante aplica un techo independiente.
   */
  const limites=[
    {key:"capacidadRiesgo",valor:capacidadRiesgo,reglas:[[25,0],[40,1],[60,2]]},
    {key:"horizonte",valor:horizonte,reglas:[[25,0],[50,1],[70,2]]},
    {key:"liquidez",valor:liquidez,reglas:[[25,0],[50,1],[70,2]]},
    {key:"experiencia",valor:experiencia,reglas:[[25,1],[50,2],[70,3]]}
  ];
  const limitesAplicados=[];
  limites.forEach(({key,valor,reglas})=>{
    if(valor==null) return;
    for(const [umbral,maxNivel] of reglas){
      if(valor<=umbral){
        nivelFinal=Math.min(nivelFinal,maxNivel);
        limitesAplicados.push({dimension:key,maxNivel,umbral,valor});
        break;
      }
    }
  });

  const faltantes=[];
  if(edad==null) faltantes.push("edad");
  if(toleranciaRiesgo==null) faltantes.push("tolerancia al riesgo");
  if(capacidadRiesgo==null) faltantes.push("capacidad para soportar pérdidas");
  if(horizonte==null) faltantes.push("horizonte temporal");
  if(liquidez==null) faltantes.push("necesidad de liquidez");
  if(experiencia==null) faltantes.push("conocimientos de inversión");

  let confianza="Alta";
  if(faltantes.length>=2 || [capacidadRiesgo,horizonte,liquidez].some(v=>v==null)) confianza="Baja";
  else if(faltantes.length===1) confianza="Media";

  const factoresPositivos=[];
  const factoresNegativos=[];
  const nombres=[
    ["toleranciaRiesgo","Cómo llevas los altibajos (tolerancia al riesgo)"],
    ["capacidadRiesgo","Capacidad para soportar pérdidas"],
    ["horizonte","Tiempo por delante (horizonte)"],
    ["liquidez","Cuándo podrías necesitar el dinero (liquidez)"],
    ["experiencia","Conocimientos de inversión"]
  ];
  nombres.forEach(([key,label])=>{
    const v=dimensiones[key];
    if(v==null) return;
    if(v>=70) factoresPositivos.push(label+" alta");
    else if(v<50) factoresNegativos.push(label+" limitada");
  });
  if(coberturaEmergencia!=null && coberturaEmergencia<3) factoresNegativos.push("El fondo de emergencia todavía es reducido");
  if(ratioDeuda!=null && ratioDeuda>0.25) factoresNegativos.push("La carga de deuda reduce la capacidad de asumir pérdidas");
  if(ahorroDisponible<=0) factoresNegativos.push("No existe ahorro mensual disponible para absorber pérdidas");
  if(qLiquidezDetalle!=null && qLiquidezDetalle<=1) factoresNegativos.push("Podrías necesitar gran parte de la inversión a corto plazo");
  if(qColchonAlternativo!=null && qColchonAlternativo<=1) factoresNegativos.push("No existe un colchón alternativo suficiente");
  if(deudaPendiente<=0 && qPatrimonio>=3) factoresPositivos.push("Patrimonio neto y deuda favorables");
  if(importeObjetivo>0 && plazoObjetivo>0 && coberturaObjetivo!=null && coberturaObjetivo<0.50 && plazoObjetivo<=5) factoresNegativos.push("El objetivo necesita todavía una parte importante de financiación");
  limitesAplicados.forEach(l=>{
    const etiqueta={
      capacidadRiesgo:"tu capacidad financiera para soportar pérdidas",
      horizonte:"tu horizonte temporal",
      liquidez:"tu necesidad de liquidez",
      experiencia:"tus conocimientos de inversión"
    }[l.dimension] || l.dimension;
    factoresNegativos.push("Tu perfil se ha limitado por "+etiqueta+", aunque tu tolerancia al riesgo sea más alta");
  });
  if(!factoresPositivos.length) factoresPositivos.push("No hay una dimensión claramente alta que impulse el perfil");
  if(!factoresNegativos.length) factoresNegativos.push("No se detectan limitaciones relevantes entre las dimensiones evaluadas");

  /* Las razones de un techo de seguridad aplicado (limitesAplicados) son la
     explicación más importante de por qué el perfil final es más bajo de lo
     que sugerirían tus respuestas de tolerancia — nunca deben quedar fuera
     por el recorte a 3 elementos. Las priorizamos primero en la lista. */
  const factoresNegativosUnicos=[...new Set(factoresNegativos)];
  const razonesTecho=factoresNegativosUnicos.filter(f=>f.startsWith("Tu perfil se ha limitado por"));
  const otrasRazones=factoresNegativosUnicos.filter(f=>!f.startsWith("Tu perfil se ha limitado por"));
  const factoresNegativosFinal=[...razonesTecho,...otrasRazones].slice(0,3);

  const factoresTenidosEnCuenta=[
    "Objetivo principal y su prioridad",
    "Objetivo y preferencia de crecimiento",
    "Horizonte temporal de la inversión",
    "Necesidad de liquidez",
    "Capacidad financiera para soportar pérdidas",
    "Tolerancia ante caídas de mercado",
    "Conocimientos y experiencia de inversión",
    "Edad como contexto, sin sustituir al horizonte"
  ];

  return {
    ...dimensiones,
    puntuacionBase:baseScore,
    dimensionesPonderadas,
    limitesAplicados,
    perfil:PERFILES_NIVELES[nivelFinal],
    confianza,
    faltantes,
    factoresPositivos:[...new Set(factoresPositivos)].slice(0,3),
    factoresNegativos:factoresNegativosFinal,
    factoresTenidosEnCuenta,
    factoresCapacidad:{ ahorroDisponible, coberturaEmergencia, ratioDeuda, deudaPendiente, importeObjetivo, plazoObjetivo, coberturaObjetivo }
  };
}

function euros(n, dec=0){ if(n==null||isNaN(n)) return "—"; return n.toLocaleString("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function pct(n, dec=1){ if(n==null||isNaN(n)) return "—"; return n.toLocaleString("es-ES",{minimumFractionDigits:dec,maximumFractionDigits:dec}) + "%"; }
function totalMensual(obj){ return Object.values(obj).reduce((acc,item)=>{ const f=FRECUENCIAS.find(x=>x.value===item.frecuencia)||FRECUENCIAS[0]; return acc + Number(item.valor||0)/f.divisor; },0); }
function emptyCampo(defs){ return Object.fromEntries(defs.map(d=>[d.key,{valor:0,frecuencia:"mensual"}])); }
/* UX: copy de coaching; umbrales y cálculo permanecen intactos. */
function estadoAhorro(ratio){
  if(ratio<0) return {nombre:"Construyendo tu base", color:C.mej, light:C.mejLight, Ico:I.alert};
  if(ratio<0.1) return {nombre:"Margen de mejora", color:C.mej, light:C.mejLight, Ico:I.alert};
  if(ratio<0.2) return {nombre:"Base saludable", color:C.salu, light:C.saluLight, Ico:I.check};
  return {nombre:"Muy buena base", color:C.exc, light:C.excLight, Ico:I.check};
}
/* ============================================================
   PUNTUACIÓN DE SALUD FINANCIERA (0-100) — combina cuatro señales,
   no solo el ratio de ahorro, para dar una foto más completa.
   ============================================================ */
function calcularSaludFinanciera({ratioAhorro, coberturaMeses, cargaDeuda, perfil}){
  const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
  const ptsAhorro = clamp(ratioAhorro,0,0.25)/0.25 * 40;
  const ptsFondo = clamp(coberturaMeses,0,6)/6 * 30;
  const ptsDeuda = (1-clamp(cargaDeuda,0,0.3)/0.3) * 20;
  const ptsPerfil = perfil ? 10 : 0;
  const score = Math.round(ptsAhorro+ptsFondo+ptsDeuda+ptsPerfil);
  /* UX: copy más humano; score, ponderaciones y umbrales permanecen intactos. */
  let nivel;
  if(score<35) nivel={nombre:"Construyendo tu base", color:C.mej, light:C.mejLight};
  else if(score<60) nivel={nombre:"Margen de mejora", color:C.mej, light:C.mejLight};
  else if(score<80) nivel={nombre:"Base saludable", color:C.salu, light:C.saluLight};
  else nivel={nombre:"Muy buena salud", color:C.exc, light:C.excLight};
  return { score, ...nivel, desglose:{ptsAhorro,ptsFondo,ptsDeuda,ptsPerfil} };
}
function proyeccionInteres(inicial, mensual, tasaAnual, anios){
  const r = tasaAnual/100/12; const meses = anios*12;
  let valorFuturo;
  if(r===0) valorFuturo = inicial + mensual*meses;
  else { const pow=Math.pow(1+r,meses); valorFuturo = inicial*pow + mensual*((pow-1)/r); }
  const totalAportado = inicial + mensual*meses;
  return { anios, totalAportado, valorFuturo, interesGenerado: valorFuturo-totalAportado };
}

/* ============================================================
   AMORTIZACIÓN DE DEUDA — bola de nieve vs. avalancha
   ============================================================ */
function simularAmortizacion(deudas, extraMensual, estrategia){
  const MAX_MESES = 480;
  const activos = deudas
    .filter(d=>Number(d.pendiente)>0)
    .map(d=>({
      nombre: d.nombre || "Deuda sin nombre",
      saldo: Number(d.pendiente),
      tasaMensual: Number(d.tasa)/100/12,
      cuotaMin: Number(d.cuota)||0,
      liquidada: false,
      mesLiquidacion: null,
      interesPagado: 0,
    }));

  const orden = estrategia==="avalancha"
    ? [...activos].sort((a,b)=> b.tasaMensual - a.tasaMensual)
    : [...activos].sort((a,b)=> a.saldo - b.saldo);

  let extraLiberado = 0;
  let totalInteres = 0;
  let mes = 0;

  while(orden.some(d=>!d.liquidada) && mes < MAX_MESES){
    mes++;
    for(const d of orden){
      if(d.liquidada) continue;
      const interes = d.saldo * d.tasaMensual;
      d.interesPagado += interes;
      totalInteres += interes;
      d.saldo += interes;
      const pagoMin = Math.min(d.cuotaMin, d.saldo);
      d.saldo -= pagoMin;
      if(d.saldo <= 0.01){ d.saldo=0; d.liquidada=true; d.mesLiquidacion=mes; extraLiberado+=d.cuotaMin; }
    }
    let presupuestoExtra = (Number(extraMensual)||0) + extraLiberado;
    for(const d of orden){
      if(d.liquidada) continue;
      if(presupuestoExtra<=0) break;
      const pago = Math.min(presupuestoExtra, d.saldo);
      d.saldo -= pago;
      presupuestoExtra -= pago;
      if(d.saldo <= 0.01){ d.saldo=0; d.liquidada=true; d.mesLiquidacion=mes; extraLiberado+=d.cuotaMin; }
      break;
    }
  }

  return { orden, totalInteres, mesesTotal: mes, todasLiquidadas: orden.every(d=>d.liquidada) };
}
function formatMeses(m){
  const anios=Math.floor(m/12), meses=m%12;
  if(anios===0) return meses+(meses===1?" mes":" meses");
  if(meses===0) return anios+(anios===1?" año":" años");
  return anios+"a "+meses+"m";
}

/* ============================================================
   PERSISTENCIA LOCAL — localStorage del navegador
   ============================================================ */
function useDatosPersistidos(){
  const [ready,setReady]=useState(false);
  const [savedState,setSavedState]=useState(null);

  useEffect(()=>{
    let cancelled=false;
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if(!cancelled && raw){ setSavedState(JSON.parse(raw)); }
    }catch(e){ /* sin datos guardados aún o almacenamiento no disponible */ }
    finally{ if(!cancelled) setReady(true); }
    return ()=>{cancelled=true;};
  },[]);

  const save = useCallback(async (state)=>{
    try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* fallo silencioso */ }
  },[]);

  const clear = useCallback(async ()=>{
    try{ window.localStorage.removeItem(STORAGE_KEY); }
    catch(e){ /* ignorar */ }
  },[]);

  return { ready, savedState, save, clear };
}

/* ============================================================
   TOAST — feedback discreto de guardado (local y nube)
   ============================================================ */
function useToast(){
  const [toast,setToast]=useState(null);
  const hideTimer=useRef(null);
  const show=useCallback((msg, tone="ok")=>{
    if(hideTimer.current) clearTimeout(hideTimer.current);
    setToast({ msg, tone, key: Date.now() });
    hideTimer.current=setTimeout(()=>setToast(null), 2200);
  },[]);
  return { toast, show };
}
function Toast({ toast }){
  if(!toast) return null;
  const tone = toast.tone === "error" ? { bg:C.crit, ico:I.x } : { bg:C.navy, ico:I.check };
  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 toast-enter" key={toast.key}>
      <div className="flex items-center gap-2 px-4 py-2.5 rounded-full shadow-lg text-xs font-bold" style={{ backgroundColor: tone.bg, color: C.white }}>
        <tone.ico size={14} color={C.white}/> {toast.msg}
      </div>
    </div>
  );
}

function useDebouncedEffect(fn, deps, delay=700){
  const timer=useRef(null);
  useEffect(()=>{
    if(timer.current) clearTimeout(timer.current);
    timer.current=setTimeout(fn, delay);
    return ()=> timer.current && clearTimeout(timer.current);
    // eslint-disable-next-line
  }, deps);
}

/* ============================================================
   AUTENTICACIÓN (Supabase Auth — email/password)
   ============================================================ */
function useAuth(){
  const [user,setUser]=useState(null);
  const [authReady,setAuthReady]=useState(false);

  useEffect(()=>{
    supa.auth.getSession().then(({data})=>{
      setUser(data?.session?.user ?? null);
      setAuthReady(true);
    });
    const { data: listener } = supa.auth.onAuthStateChange((_event, session)=>{
      setUser(session?.user ?? null);
    });
    return ()=> listener?.subscription?.unsubscribe();
  },[]);

  const signUp = useCallback(async (email,password)=>{
    const { data, error } = await supa.auth.signUp({ email, password, options: { emailRedirectTo: window.location.origin } });
    return { data, error };
  },[]);
  const signIn = useCallback(async (email,password)=>{
    const { data, error } = await supa.auth.signInWithPassword({ email, password });
    return { data, error };
  },[]);
  const signOut = useCallback(async ()=>{
    await supa.auth.signOut();
  },[]);

  return { user, authReady, signUp, signIn, signOut };
}

/* ============================================================
   SINCRONIZACIÓN CON LA NUBE (Supabase)
   ============================================================ */
function useCloudSync({ user, datos, setDatos, perfil, setPerfil, perfilDetalle, setPerfilDetalle, sim, setSim, setObjetivoSeleccionadoId, quizState, setQuizState, historial, setHistorial, onSaved }){
  const [cloudReady,setCloudReady]=useState(false);
  const migratedRef = useRef(false);
  const skipNextSaveRef = useRef(false);

  useEffect(()=>{
    if(!user){ setCloudReady(false); migratedRef.current=false; return; }
    let cancelled=false;
    (async ()=>{
      const [{ data: perfilRow }, { data: historialRows }, { data: quizRow }] = await Promise.all([
        supa.from("finanzas_perfil").select("*").eq("user_id", user.id).maybeSingle(),
        supa.from("finanzas_historial").select("*").eq("user_id", user.id).order("created_at", { ascending:true }),
        supa.from("finanzas_quiz").select("*").eq("user_id", user.id).maybeSingle(),
      ]);
      if(cancelled) return;

      const hayDatosEnNube = perfilRow && Number(perfilRow.ingresos) > 0;

      if(hayDatosEnNube){
        skipNextSaveRef.current = true;
        const datosBaseNube={
          ingresos: Number(perfilRow.ingresos)||0,
          gastosFijos: perfilRow.gastos_fijos || emptyCampo(GASTOS_FIJOS_DEF),
          gastosDiscrecionales: perfilRow.gastos_disc || emptyCampo(GASTOS_DISC_DEF),
          deudas: perfilRow.deudas?.length ? perfilRow.deudas : DEUDAS_DEF.map(d=>({...d})),
          ahorroActual: Number(perfilRow.ahorro_actual)||0,
          habito: perfilRow.habito || null,
          objetivo: perfilRow.objetivo || { tipo:null, importe:0, plazoAnios:0 },
          objetivos: Array.isArray(perfilRow.objetivos) ? perfilRow.objetivos : (perfilRow.objetivo?.objetivos || []),
        };
        /* Normalizamos aquí, una sola vez, para fijar ids estables antes de
           guardar en el estado. Si no lo hiciéramos, un usuario migrado desde
           solo `objetivo` (sin `objetivos`) recibiría un id aleatorio nuevo
           cada vez que cualquier pantalla llamara a normalizarObjetivos(datos),
           rompiendo la selección del objetivo en el Simulador y el guardado
           de ediciones (ver 7.4/7.9). */
        const objetivosNubeNormalizados=normalizarObjetivos(datosBaseNube);
        const datosNube={
          ...datosBaseNube,
          objetivos: objetivosNubeNormalizados,
          objetivo: objetivoLegadoDesdeColeccion(objetivosNubeNormalizados),
        };
        setDatos(datosNube);
        const perfilNube=perfilRow.perfil_riesgo || null;
        setPerfil(perfilNube);
        const simNube=perfilRow.sim_config?.tasa ? perfilRow.sim_config : { inicial:0, mensual:0, tasa:6 };
        setSim(simNube);
        setObjetivoSeleccionadoId&&setObjetivoSeleccionadoId(simNube.objetivoId||null);
        if(quizRow){
          const respuestasNube=normalizarRespuestasQuiz(quizRow.respuestas || {});
          const estadoNube=reconstruirEstadoQuiz({
            respuestas:respuestasNube,
            paso:quizRow.paso||0,
            currentQuestionId:quizRow.current_question_id,
            questionPath:quizRow.question_path,
            terminado:!!quizRow.terminado,
            resultado:quizRow.resultado || null
          },datosNube);
          // Si existen respuestas terminadas, recalculamos con el modelo actual para no arrastrar el antiguo score.
          const resultadoNube=estadoNube.terminado ? calcularPerfilMultidimensional(estadoNube.respuestas, datosNube) : (quizRow.resultado || null);
          setQuizState({...estadoNube,resultado:resultadoNube});
          setPerfil(resultadoNube?.perfil || perfilNube);
          setPerfilDetalle(resultadoNube);
        }
        setHistorial((historialRows||[]).map(r=>({ ratio:Number(r.ratio_ahorro), ts: new Date(r.created_at).getTime() })));
        migratedRef.current = true;
      } else if(!migratedRef.current && datos.ingresos > 0){
        await migrarANube(user.id, { datos, perfil, sim, quizState, historial });
        migratedRef.current = true;
      } else {
        migratedRef.current = true;
      }
      setCloudReady(true);
    })();
    return ()=>{ cancelled=true; };
    // eslint-disable-next-line
  },[user]);

  useDebouncedEffect(()=>{
    if(!user || !cloudReady) return;
    if(skipNextSaveRef.current){ skipNextSaveRef.current=false; return; }
    if(datos.ingresos<=0) return;
    Promise.all([
      guardarPerfilEnNube(user.id, { datos, perfil, sim }),
      guardarQuizEnNube(user.id, quizState),
    ]).then(([perfilResult,quizResult])=>{
      const huboError = perfilResult?.ok===false || quizResult?.ok===false;
      if(huboError) onSaved && onSaved("No se pudo sincronizar con la nube. Tus datos siguen a salvo en este dispositivo.", "error");
      else onSaved && onSaved("Guardado en la nube");
    });
    // eslint-disable-next-line
  },[user, cloudReady, datos, perfil, sim, quizState]);

  const registrarSnapshotNube = useCallback(async (ratio)=>{
    if(!user) return;
    await supa.from("finanzas_historial").insert({ user_id:user.id, ratio_ahorro:ratio });
  },[user]);

  return { cloudReady, registrarSnapshotNube };
}

async function guardarPerfilEnNube(userId, { datos, perfil, sim }){
  try{
    const objetivos=normalizarObjetivos(datos);
    const payload={
      user_id: userId,
      ingresos: datos.ingresos,
      gastos_fijos: datos.gastosFijos,
      gastos_disc: datos.gastosDiscrecionales,
      deudas: datos.deudas,
      ahorro_actual: datos.ahorroActual,
      habito: datos.habito,
      objetivo: objetivoLegadoDesdeColeccion(objetivos),
      objetivos,
      perfil_riesgo: perfil,
      sim_config: sim,
      updated_at: new Date().toISOString(),
    };
    const {error}=await supa.from("finanzas_perfil").upsert(payload);
    if(error){
      /* Compatibilidad: instalaciones antiguas sin columna `objetivos`. La colección
         queda embebida en `objetivo` si ese campo es JSON; si tampoco lo admite,
         se conserva el objetivo principal sin bloquear la aplicación. */
      const {error:fallbackError}=await supa.from("finanzas_perfil").upsert({...payload,objetivos:undefined});
      if(fallbackError) return { ok:false, error:fallbackError };
    }
    return { ok:true };
  }catch(e){ return { ok:false, error:e }; /* localStorage sigue como respaldo local */ }
}
async function guardarQuizEnNube(userId, quizState){
  const filaBase={
    user_id: userId,
    respuestas: quizState.respuestas,
    paso: quizState.paso,
    terminado: quizState.terminado,
    updated_at: new Date().toISOString(),
  };
  const filaAdaptativa={
    ...filaBase,
    current_question_id:quizState.currentQuestionId || null,
    question_path:Array.isArray(quizState.questionPath) ? quizState.questionPath : [],
  };
  try{
    const { error } = await supa.from("finanzas_quiz").upsert({ ...filaAdaptativa, resultado: quizState.resultado || null });
    if(error){
      /* Compatibilidad con esquemas antiguos: conserva las columnas históricas. */
      const { error:legacyError } = await supa.from("finanzas_quiz").upsert({ ...filaBase, resultado: quizState.resultado || null });
      if(legacyError){
        const { error:finalError } = await supa.from("finanzas_quiz").upsert(filaBase);
        if(finalError) return { ok:false, error:finalError };
      }
    }
    return { ok:true };
  }catch(e){
    try{
      const { error:legacyError } = await supa.from("finanzas_quiz").upsert({ ...filaBase, resultado: quizState.resultado || null });
      if(legacyError){
        const { error:finalError } = await supa.from("finanzas_quiz").upsert(filaBase);
        if(finalError) return { ok:false, error:finalError };
      }
      return { ok:true };
    }catch(_e){ return { ok:false, error:_e }; /* localStorage sigue como respaldo */ }
  }
}
async function migrarANube(userId, { datos, perfil, sim, quizState, historial }){
  await guardarPerfilEnNube(userId, { datos, perfil, sim });
  await guardarQuizEnNube(userId, quizState);
  if(historial && historial.length){
    const filas = historial.map(h=>({ user_id:userId, ratio_ahorro:h.ratio, created_at: new Date(h.ts||Date.now()).toISOString() }));
    try{ await supa.from("finanzas_historial").insert(filas); }catch(e){ /* fallo silencioso */ }
  }
}

function focusNextInSequence(e){
  const container=e.currentTarget.closest("[data-seq-group]");
  if(!container) return;
  const fields=Array.from(container.querySelectorAll("[data-seq-field]"));
  const idx=fields.indexOf(e.currentTarget);
  if(idx>-1 && idx<fields.length-1){
    const next=fields[idx+1];
    next.focus();
    if(next.select) next.select();
  } else if(idx>-1){
    e.currentTarget.blur();
  }
}

function AnimatedNumber({value,format=v=>euros(v)}){
  const [display,setDisplay]=useState(value);
  const fromRef=useRef(value); const rafRef=useRef(null);
  useEffect(()=>{
    const from=fromRef.current, to=value;
    if(from===to) return;
    const start=performance.now(); const duration=450;
    const tick=(now)=>{
      const t=Math.min(1,(now-start)/duration);
      const eased=1-Math.pow(1-t,3);
      setDisplay(from+(to-from)*eased);
      if(t<1) rafRef.current=requestAnimationFrame(tick);
      else fromRef.current=to;
    };
    rafRef.current=requestAnimationFrame(tick);
    return ()=> rafRef.current && cancelAnimationFrame(rafRef.current);
  },[value]);
  return format(display);
}

/* Gráfico de área simple, sin librerías externas */
function niceTicks(maxV, targetCount=6){
  if(!(maxV>0)) return {ticks:[0], niceMax:1};
  const rawStep = maxV/targetCount;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep/mag;
  const niceNorm = norm<1.5 ? 1 : norm<3 ? 2 : norm<7 ? 5 : 10;
  const step = niceNorm*mag;
  const niceMax = Math.ceil(maxV/step)*step;
  const ticks=[];
  for(let v=0; v<=niceMax+step*0.001; v+=step) ticks.push(v);
  return {ticks, niceMax, step};
}

function SimpleAreaChart({ data, xKey, series, height=240, formatY=(v)=>v }){
  const [hoverIndex,setHoverIndex]=useState(null);
  const width=680, padL=46, padR=10, padT=10, padB=36;
  const innerW=width-padL-padR, innerH=height-padT-padB;
  const allValues = data.flatMap(d=> series.map(s=>d[s.key]||0));
  const maxRaw = Math.max(1, ...allValues);
  const {ticks, niceMax} = niceTicks(maxRaw, 6);
  const xFor = i => padL + (innerW * (data.length<=1?0:i/(data.length-1)));
  const yFor = v => padT + innerH - (innerH * (v/niceMax));
  const handleMove = e => {
    if(!data.length) return;
    const rect = e.currentTarget.getBoundingClientRect();
    // 1. Píxeles físicos del ratón dentro del contenedor
    const screenX = e.clientX - rect.left;
    // 2. Escalar esos píxeles físicos al sistema de coordenadas interno del SVG (width: 680)
    const svgX = (screenX / rect.width) * width;
    // 3. Ahora ya podemos restar el padding interno del SVG
    const innerX = svgX - padL;
    const fraction = innerX / innerW;
    const raw = fraction * (data.length - 1);
    setHoverIndex(Math.max(0, Math.min(data.length - 1, Math.round(raw))));
  };
  const hovered = hoverIndex==null ? null : data[hoverIndex];
  const tooltipX = hoverIndex==null ? 0 : xFor(hoverIndex);
  const tooltipW=172;
  const tooltipLeft = Math.max(6, Math.min(width-tooltipW-6, tooltipX-tooltipW/2));
  return (
    <div className="relative w-full h-full chart-interactive" onMouseMove={handleMove} onMouseLeave={()=>setHoverIndex(null)}>
      <svg viewBox={"0 0 "+width+" "+height} className="w-full h-full" role="img" aria-label="Gráfico interactivo de interés compuesto">
        {ticks.map((t,i)=>(
          <g key={i}>
            <line x1={padL} x2={width-padR} y1={yFor(t)} y2={yFor(t)} stroke={C.border} strokeDasharray={t===0?"0":"3 3"}/>
            <text x={padL-6} y={yFor(t)+3} fontSize="10" fill={C.muted} textAnchor="end">{formatY(t)}</text>
          </g>
        ))}
        {series.map((s,si)=>{
          const pts = data.map((d,i)=>[xFor(i), yFor(d[s.key]||0)]);
          const areaPath = "M"+pts.map(p=>p.join(",")).join(" L") + " L"+xFor(data.length-1)+","+(padT+innerH)+" L"+padL+","+(padT+innerH)+" Z";
          const linePath = "M"+pts.map(p=>p.join(",")).join(" L");
          return (
            <g key={si}>
              <path d={areaPath} fill={s.color} opacity={s.opacity ?? 0.3}/>
              <path d={linePath} fill="none" stroke={s.color} strokeWidth={2.2}/>
            </g>
          );
        })}
        {data.map((d,i)=>(
          <text key={i} x={xFor(i)} y={height-padB+14} fontSize="8" fill={C.muted} textAnchor="end" transform={`rotate(-60, ${xFor(i)}, ${height-padB+14})`}>{d[xKey]}</text>
        ))}
        <rect x={padL} y={padT} width={innerW} height={innerH} fill="transparent" pointerEvents="all"/>
        {hoverIndex!=null && hovered && <>
          <line x1={tooltipX} x2={tooltipX} y1={padT} y2={padT+innerH} stroke={C.sand} strokeWidth="1.5" strokeDasharray="4 3" opacity=".7"/>
          {series.map((s,si)=><circle key={si} cx={tooltipX} cy={yFor(hovered[s.key]||0)} r="4" fill={C.surface} stroke={s.color} strokeWidth="2.5"/>) }
          <g transform={`translate(${tooltipLeft},8)`}>
            <rect width={tooltipW} height={66 + series.length*16} rx="10" fill="#ffffff" stroke={C.border} filter="drop-shadow(0 5px 12px rgba(49,46,129,.12))"/>
            <text x="12" y="19" fontSize="10" fontWeight="700" fill={C.navy}>{hovered[xKey]}</text>
            {series.map((s,si)=><g key={si} transform={`translate(0,${30+si*16})`}>
              <circle cx="13" cy="-3" r="3" fill={s.color}/>
              <text x="21" y="0" fontSize="10" fill={C.muted}>{s.label || s.key}: <tspan fontWeight="700" fill={C.ink}>{formatY(hovered[s.key]||0)}</tspan></text>
            </g>)}
          </g>
        </>}
      </svg>
    </div>
  );
}

/* Donut simple, sin librerías externas */
function SimpleDonut({ data, size=200, thickness=28 }){
  const [hover,setHover]=useState(null);
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  const r = (size-thickness)/2;
  const circumference = 2*Math.PI*r;
  let acc=0;
  const segments = data.map((d,i)=>{
    const frac=d.value/total;
    const dash = circumference*frac;
    const gap = circumference-dash;
    const rotation = (acc/total)*360;
    acc += d.value;
    return {...d, dash, gap, rotation, i};
  });
  const active = hover!=null ? segments[hover] : null;
  return (
    <div className="relative inline-block" style={{width:size,height:size}}>
      <svg width={size} height={size} viewBox={"0 0 "+size+" "+size}>
        <g transform={"rotate(-90 "+size/2+" "+size/2+")"}>
          {segments.map(seg=>(
            <circle key={seg.i} cx={size/2} cy={size/2} r={r} fill="none" stroke={seg.color}
              strokeWidth={hover===seg.i ? thickness+6 : thickness}
              strokeDasharray={seg.dash+" "+seg.gap} transform={"rotate("+seg.rotation+" "+size/2+" "+size/2+")"}
              style={{transition:"stroke-width 200ms ease, opacity 200ms ease", opacity: hover==null || hover===seg.i ? 1 : 0.35, cursor:"pointer"}}
              onMouseEnter={()=>setHover(seg.i)} onMouseLeave={()=>setHover(null)}
            />
          ))}
        </g>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center px-3">
        {active ? (
          <>
            <div className="text-xl font-bold font-serif" style={{color:active.color}}>{active.value}%</div>
            <div className="text-[10px] font-bold mt-0.5 leading-tight" style={{color:C.muted}}>{active.name}</div>
          </>
        ) : (
          <div className="text-[10px] font-bold" style={{color:C.mutedLight}}>Pasa el cursor<br/>por el gráfico</div>
        )}
      </div>
    </div>
  );
}

function traducirErrorAuth(mensaje){
  const m = String(mensaje||"");
  if(/invalid login credentials/i.test(m)) return "Email o contraseña incorrectos.";
  if(/user already registered/i.test(m)) return "Ya existe una cuenta con este email. Inicia sesión.";
  if(/email not confirmed/i.test(m)) return "Confirma tu email antes de iniciar sesión (revisa tu bandeja de entrada).";
  if(/password should be at least 6 characters/i.test(m)) return "La contraseña debe tener al menos 6 caracteres.";
  if(/unable to validate email address|invalid email/i.test(m)) return "Introduce un email válido.";
  if(/rate limit/i.test(m)) return "Demasiados intentos. Espera un momento e inténtalo de nuevo.";
  return "No se pudo completar la operación. Inténtalo de nuevo.";
}

function AuthModal({ onClose, onAuthSuccess, signUp, signIn }){
  const [modo,setModo]=useState("registro");

  const [password,setPassword]=useState("");
  const [verPassword,setVerPassword]=useState(false);

  const [avisoConfirmacion,setAvisoConfirmacion]=useState(false);

  const submit=async(e)=>{
    e.preventDefault();
    setError(null); setLoading(true);
    try{
      if(modo==="registro"){
        const { data, error } = await signUp(email,password);
        if(error){ setError(traducirErrorAuth(error.message)); }
        else if(data?.session){ onAuthSuccess(); }
        else { setAvisoConfirmacion(true); }
      } else {
        const { data, error } = await signIn(email,password);

function AnimatedStatValue({raw}){
  const m = raw.match(/^([>~]?)([+-]?)([\d.,]+)/);
  const prefix = m?m[1]:"";
  const sign = m?m[2]:"";
  const target = m? parseFloat(m[3].replace(",",".")) : 0;
  const [display,setDisplay]=useState(0);
  useEffect(()=>{
    let raf; const start=performance.now(); const duration=900;
    const tick=(now)=>{
      const t=Math.min(1,(now-start)/duration);
      const eased=1-Math.pow(1-t,3);
      setDisplay(target*eased);
      if(t<1) raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    return ()=> raf && cancelAnimationFrame(raf);
    // eslint-disable-next-line
  },[target]);
  return <>{prefix}{sign}{display.toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1})}%</>;
}

/* ============================================================
   PLAN DE AMORTIZACIÓN DE DEUDA (bola de nieve vs. avalancha)
   ============================================================ */
function AmortizacionDeuda({deudas}){
  const [extra,setExtra]=useState(0);
  const [vista,setVista]=useState("nieve");
  const deudasActivas=useMemo(()=>deudas.filter(d=>Number(d.pendiente)>0),[deudas]);
  const resultado=useMemo(()=>{
    if(deudasActivas.length===0) return null;
    return {nieve:simularAmortizacion(deudasActivas,extra,"nieve"),avalancha:simularAmortizacion(deudasActivas,extra,"avalancha"),soloMinimos:simularAmortizacion(deudasActivas,0,"nieve")};
  },[deudasActivas,extra]);
  if(!resultado) return null;
  const {nieve,avalancha,soloMinimos}=resultado;
  const ahorroNieve=soloMinimos.totalInteres-nieve.totalInteres;
  const ahorroAvalancha=soloMinimos.totalInteres-avalancha.totalInteres;
  const mejorInteres=avalancha.totalInteres<=nieve.totalInteres?"avalancha":"nieve";
  const datosVista=vista==="nieve"?nieve:avalancha;
  const resumenTiempo=r=>r.todasLiquidadas?formatMeses(r.mesesTotal):"+40 años";
  const cuotasMensuales=deudasActivas.reduce((s,d)=>s+Number(d.cuota||0),0);
  const ahorroInteresMax=Math.max(0,ahorroNieve,ahorroAvalancha);

  return (
    <Card className="p-5">
      {/* UX: reencuadre emocional de la deuda; la simulación matemática no cambia. */}
      <div className="flex items-start gap-3 mb-2">
        <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{backgroundColor:C.saluLight}}><I.rocket size={18} color={C.salu}/></div>
        <div>
          <Eyebrow>Estrategia para eliminar tus deudas</Eyebrow>
          <h3 className="font-serif text-xl font-bold mt-1" style={{color:C.ink}}>Un plan claro para quedarte sin deudas</h3>
          <p className="text-sm mt-1" style={{color:C.muted}}>Cuando termines de pagar una deuda, la cuota que le dedicabas queda libre para tus objetivos.</p>
        </div>
      </div>
      <div className="rounded-2xl p-4 mb-5" style={{backgroundColor:C.saluLight,border:"1px solid rgba(16,185,129,.16)"}}>
        <div className="text-xs font-bold uppercase" style={{color:C.salu,letterSpacing:"0.08em"}}>Cuando elimines todas tus deudas</div>
        <div className="font-serif text-2xl font-bold mt-1" style={{color:C.ink}}>Recuperarás {euros(cuotasMensuales)} al mes</div>
        <p className="text-xs mt-1" style={{color:C.muted}}>Ahora mismo esas cuotas están comprometidas. En cuanto saldes las deudas, ese dinero queda libre y puedes destinarlo a tu fondo de emergencia o a tus objetivos.</p>

            <div className="text-xs mt-1" style={{color:C.muted}}>{e.desc}</div>

function SelectorCalculadora({onRecomendar}){
  const [abierto,setAbierto]=useState(false);
  const [paso,setPaso]=useState(1);
  const [recomendacion,setRecomendacion]=useState(null);

  const elegirTieneMeta=(tieneMeta)=>{
    if(!tieneMeta){
      setRecomendacion({modo:"capital",titulo:"Capital final: ¿cuánto tendré?",texto:"Como no tienes una meta concreta, te mostramos hasta dónde puede llegar tu ahorro con el tiempo."});
    } else {
      setPaso(2);
    }
  };
  const elegirDuda=(modo,titulo,texto)=>setRecomendacion({modo,titulo,texto});
  const reiniciar=()=>{setPaso(1);setRecomendacion(null);};
  const volver=()=>setPaso(1);

  if(!abierto) return (
    <Card className="p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-6">
      <div><Eyebrow>¿No sabes cuál usar?</Eyebrow><p className="text-sm mt-1" style={{color:C.ink}}>Contesta un par de preguntas rápidas y te decimos qué calculadora encaja con lo que necesitas, y por qué.</p></div>
      <button onClick={()=>setAbierto(true)} className="shrink-0 inline-flex items-center gap-1.5 text-sm font-bold px-4 py-2.5 rounded-xl" style={{backgroundColor:C.sand,color:C.white}}>Ayúdame a elegir</button>
    </Card>
  );

  return (
    <Card className="p-5 sm:p-6 mb-6">
      <div className="flex items-center justify-between gap-3"><Eyebrow>Te ayudamos a elegir</Eyebrow><button onClick={()=>{setAbierto(false);reiniciar();}} className="text-xs font-bold" style={{color:C.muted}}>Cerrar</button></div>

      {!recomendacion && paso===1 && <>
        <h3 className="font-serif text-lg font-bold mt-2" style={{color:C.ink}}>¿Tienes ya una cifra concreta que quieres ahorrar?</h3>
        <div className="flex flex-wrap gap-2 mt-3">
          <button onClick={()=>elegirTieneMeta(true)} className="px-4 py-2.5 rounded-xl border text-sm font-bold" style={{borderColor:C.border,backgroundColor:C.paper,color:C.ink}}>Sí, tengo una meta en mente</button>
          <button onClick={()=>elegirTieneMeta(false)} className="px-4 py-2.5 rounded-xl border text-sm font-bold" style={{borderColor:C.border,backgroundColor:C.paper,color:C.ink}}>No, quiero ver hasta dónde llego</button>
        </div>
      </>}

      {!recomendacion && paso===2 && <>
        <button onClick={volver} className="inline-flex items-center gap-1.5 text-xs font-bold mb-1" style={{color:C.muted}}><I.arrowLeft size={13}/> Volver</button>
        <h3 className="font-serif text-lg font-bold mt-2" style={{color:C.ink}}>¿Qué es lo que no tienes claro?</h3>
        <div className="flex flex-col gap-2 mt-3">
          <button onClick={()=>elegirDuda("tiempo","Tiempo para llegar a tu meta","Con tu meta ya definida, esta calculadora te dice cuántos años y meses necesitas para alcanzarla.")} className="px-4 py-2.5 rounded-xl border text-sm font-bold text-left" style={{borderColor:C.border,backgroundColor:C.paper,color:C.ink}}>Cuánto tiempo me llevará llegar</button>
          <button onClick={()=>elegirDuda("aportacion","Aportación mensual necesaria","Con tu meta y el plazo, esta calculadora te dice cuánto necesitas ahorrar cada mes para llegar.")} className="px-4 py-2.5 rounded-xl border text-sm font-bold text-left" style={{borderColor:C.border,backgroundColor:C.paper,color:C.ink}}>Cuánto tengo que ahorrar cada mes</button>
          <button onClick={()=>elegirDuda("rentabilidad","Rentabilidad necesaria","Con tu meta, tu plazo y lo que aportas, esta calculadora te dice qué rentabilidad necesitarías para lograrlo.")} className="px-4 py-2.5 rounded-xl border text-sm font-bold text-left" style={{borderColor:C.border,backgroundColor:C.paper,color:C.ink}}>Si lo que espero ganar será suficiente</button>
        </div>
      </>}

      {recomendacion && <div className="mt-2">
        <div className="rounded-xl p-4" style={{backgroundColor:C.saluLight,color:C.ink}}>
          <div className="text-xs font-bold uppercase" style={{color:C.salu,letterSpacing:".1em"}}>Te recomendamos</div>
          <h3 className="font-serif text-lg font-bold mt-1">{recomendacion.titulo}</h3>
          <p className="text-sm mt-1.5">{recomendacion.texto}</p>
        </div>
        <div className="flex flex-wrap items-center gap-4 mt-4">
          <button onClick={()=>onRecomendar(recomendacion.modo)} className="inline-flex items-center gap-1.5 text-sm font-bold px-4 py-2.5 rounded-xl" style={{backgroundColor:C.sand,color:C.white}}>Abrir esta calculadora</button>
