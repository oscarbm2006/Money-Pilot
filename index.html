function Simulador({sim,setSim,objetivos=[],objetivoSeleccionadoId=null,onSeleccionarObjetivo,ahorroDisponible=0,perfil=null,onIrACalculadoras}){
  const [vista,setVista]=useState("5anos");
  const seleccionado=objetivos.find(o=>o.id===objetivoSeleccionadoId) || null;
  const tieneDatos = !!seleccionado || !!perfil;

  // UX: el simulador ya no pide números al usuario; calcula automáticamente
  // el escenario que le corresponde a partir de su objetivo guardado y/o su
  // perfil de riesgo. Si quiere tocar cifras libremente, se le dirige a
  // la vista de calculadoras, pensada para eso.
  const inicial = seleccionado ? (seleccionado.importeReservadoAplicado ?? 0) : 0;
  const mensual = seleccionado ? (seleccionado.aportacionMensual ?? ahorroDisponible ?? 0) : (ahorroDisponible ?? 0);
  const tasa = perfil ? PERFILES_INFO[perfil].rentabilidad : 4;
  const horizonte = seleccionado ? (seleccionado.horizonteAniosCalculado ?? seleccionado.plazoAnios ?? 10) : 10;
  const horizonteSim=Number(horizonte)>0?Number(horizonte):10;

  const serie=useMemo(()=>Array.from({length:50},(_,i)=>proyeccionInteres(Number(inicial)||0,Number(mensual)||0,Number(tasa)||0,i+1)),[inicial,mensual,tasa]);
  const resultadoObjetivo=useMemo(()=>{
    if(!seleccionado || !horizonteSim || seleccionado.importeObjetivo==null) return null;
    const p=proyeccionInteres(Number(inicial)||0,Number(mensual)||0,Number(tasa)||0,horizonteSim);
    const objetivo=Number(seleccionado.importeObjetivo);
    return {objetivo,restante:seleccionado.importeRestante,valor:p.valorFuturo,alcanzado:p.valorFuturo>=objetivo,aportado:p.totalAportado};
  },[seleccionado,inicial,mensual,tasa,horizonteSim]);
  const filasTabla=useMemo(()=>{
    const anos=vista==="5anos"?[5,10,15,20,25,30,35,40,45,50]:Array.from({length:Math.min(50,Math.ceil(horizonteSim)+5)},(_,i)=>i+1);
    return anos.map(a=>serie[a-1]).filter(Boolean).map((d,i,arr)=>({...d,diferenciaAnterior:d.valorFuturo-(i===0?Number(inicial)||0:arr[i-1].valorFuturo)}));
  },[serie,vista,inicial,horizonteSim]);
  const chartData=serie.slice(0,Math.min(50,Math.ceil(horizonteSim)+5)).map(d=>({anio:d.anios,aportado:Math.round(d.totalAportado),valorFuturo:Math.round(d.valorFuturo)}));
  const cargarObjetivo=o=>{ if(!o)return; onSeleccionarObjetivo&&onSeleccionarObjetivo(o.id); };
  const limpiarObjetivo=()=>{onSeleccionarObjetivo&&onSeleccionarObjetivo(null);};

  return <div className="space-y-6">
    <div><h1 className="font-serif text-2xl font-bold" style={{color:C.ink}}>Tu escenario de ahorro</h1><p className="text-sm mt-1 readable-subtitle">Calculado con tus propios datos. Es una proyección educativa: las rentabilidades son hipotéticas y no garantizan resultados futuros.</p></div>
    {objetivos.length>0 && <Card className="p-5"><div className="flex items-center justify-between gap-3"><Eyebrow>Conecta un objetivo</Eyebrow>{seleccionado&&<button onClick={limpiarObjetivo} className="text-xs font-bold" style={{color:C.muted}}>Quitar objetivo</button>}</div><div className="flex flex-wrap gap-2 mt-3">{objetivos.map(o=><button key={o.id} onClick={()=>cargarObjetivo(o)} className="px-3 py-2 rounded-lg border text-xs font-bold text-left" style={{borderColor:seleccionado?.id===o.id?C.sand:C.border,backgroundColor:seleccionado?.id===o.id?C.sandLight:C.paper,color:C.ink}}>{o.nombre || (OBJETIVOS_DEF.find(x=>x.id===o.tipo)?.label || "Objetivo sin nombre")}</button>)}</div>{seleccionado&&<div className="mt-3 rounded-xl p-3 text-xs" style={{backgroundColor:C.sandLight,color:C.ink}}><b>{seleccionado.nombre||"Objetivo seleccionado"}</b> · La proyección usa el ahorro y el plazo de este objetivo automáticamente.</div>}</Card>}

    {!tieneDatos ? (
      <Card className="p-6 text-center">
        <Eyebrow>Aún no tenemos datos suficientes</Eyebrow>
        <h3 className="font-serif text-xl font-bold mt-2" style={{color:C.ink}}>Completa tu diagnóstico y tu perfil de riesgo primero</h3>
        <p className="text-sm mt-2 max-w-md mx-auto" style={{color:C.muted}}>Así podremos calcular un escenario con tus propios números, en vez de mostrarte cifras genéricas que no te aplican.</p>
        <div className="mt-5 pt-5 max-w-md mx-auto" style={{borderTop:"1px solid "+C.border}}>
          <p className="text-xs" style={{color:C.muted}}>Mientras tanto, puedes curiosear con cifras de ejemplo en nuestra calculadora libre.</p>
          <button onClick={onIrACalculadoras} className="mt-3 inline-flex items-center gap-1.5 text-sm font-bold px-4 py-2.5 rounded-xl" style={{backgroundColor:C.sand,color:C.white}}>Prueba nuestras calculadoras</button>
        </div>
      </Card>
    ) : <>
      {!seleccionado && perfil && <div className="text-xs rounded-lg px-3 py-2.5" style={{backgroundColor:C.saluLight,color:C.ink}}>
        Este escenario usa tu ahorro disponible (<b>{euros(mensual)}/mes</b>) y la rentabilidad típica de tu perfil de riesgo (<b>{perfil} · {tasa}%</b>).
      </div>}
      {seleccionado && <Card className="p-5"><Eyebrow>Objetivo seleccionado</Eyebrow><div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mt-3 text-xs"><div><span style={{color:C.muted}}>Objetivo</span><b className="block" style={{color:C.ink}}>{seleccionado.importeObjetivo==null?"—":euros(seleccionado.importeObjetivo)}</b></div><div><span style={{color:C.muted}}>Restante</span><b className="block" style={{color:C.ink}}>{seleccionado.importeRestante==null?"—":euros(seleccionado.importeRestante)}</b></div><div><span style={{color:C.muted}}>Horizonte</span><b className="block" style={{color:C.ink}}>{horizonteSim?`${horizonteSim.toFixed(1)} años`:"—"}</b></div><div><span style={{color:C.muted}}>Necesario</span><b className="block" style={{color:C.ink}}>{seleccionado.aportacionNecesaria==null?"—":euros(seleccionado.aportacionNecesaria)+"/mes"}</b></div><div><span style={{color:C.muted}}>Tu aportación</span><b className="block" style={{color:C.ink}}>{euros(mensual)}/mes</b></div></div>{resultadoObjetivo&&<div className="mt-4 rounded-xl p-4" style={{backgroundColor:resultadoObjetivo.alcanzado?C.saluLight:C.critLight,color:C.ink}}><b>{resultadoObjetivo.alcanzado?"En este escenario hipotético, el objetivo se alcanzaría dentro del horizonte indicado.":"En este escenario hipotético, el objetivo no se alcanzaría dentro del horizonte indicado."}</b><div className="mt-1 text-xs">Valor proyectado: {euros(resultadoObjetivo.valor)} · Objetivo: {euros(resultadoObjetivo.objetivo)}.</div></div>}</Card>}

      <Card className="p-5"><Eyebrow>Crecimiento año a año</Eyebrow><div className="h-72 mt-4"><SimpleAreaChart data={chartData} xKey="anio" series={[{key:"valorFuturo",label:"Escenario hipotético",color:C.sand,opacity:0.35},{key:"aportado",label:"Aportado",color:C.slate,opacity:0.85}]} height={288} formatY={v=> v.toLocaleString("es-ES")+" €"}/></div><div className="flex gap-4 mt-2 text-xs font-bold" style={{color:C.muted}}><span>Aportado</span><span>Escenario hipotético</span></div><p className="text-[11px] readable-note mt-3">Este cálculo es una simulación matemática. La rentabilidad elegida es una hipótesis educativa y no constituye una previsión ni una garantía.</p></Card>

      <Card className="p-5 overflow-x-auto"><div className="flex items-center justify-between flex-wrap gap-3"><Eyebrow>Tabla de proyección</Eyebrow><select value={vista} onChange={e=>setVista(e.target.value)} className="text-xs font-bold rounded-lg px-3 py-1.5 border outline-none" style={{borderColor:C.border,color:C.ink,backgroundColor:C.paper}}><option value="5anos">Ver cada 5 años</option><option value="anoAno">Ver año a año</option></select></div><table className="w-full mt-4 text-sm min-w-[680px]"><thead><tr style={{borderBottom:"2px solid "+C.border}}>{["Año","Total aportado","Valor futuro hipotético","Interés generado","Crecimiento respecto al año anterior"].map(h=><th key={h} className="text-left py-2 font-bold" style={{color:C.muted}}>{h}</th>)}</tr></thead><tbody>{filasTabla.map(d=><tr key={d.anios} style={{borderBottom:"1px solid "+C.border}}><td className="py-2.5 font-bold" style={{color:C.ink}}>{d.anios}</td><td className="py-2.5" style={{color:C.ink}}>{euros(d.totalAportado)}</td><td className="py-2.5 font-bold" style={{color:C.ink}}>{euros(d.valorFuturo)}</td><td className="py-2.5 font-bold" style={{color:C.salu}}>{euros(d.interesGenerado)}</td><td className="py-2.5 font-bold" style={{color:C.mej}}>+{euros(d.diferenciaAnterior)}</td></tr>)}</tbody></table></Card>

      <Card className="p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4"><div><Eyebrow>¿Quieres jugar con los números?</Eyebrow><p className="text-sm mt-1" style={{color:C.ink}}>Si quieres cambiar la aportación, el plazo o probar otras rentabilidades libremente, usa nuestra calculadora dedicada.</p></div><button onClick={onIrACalculadoras} className="shrink-0 inline-flex items-center gap-1.5 text-sm font-bold px-4 py-2.5 rounded-xl" style={{backgroundColor:C.sand,color:C.white}}>Prueba nuestras calculadoras</button></Card>
    </>}
  </div>;
}

function PerfilRiesgo({onPerfilCalculado,quizState,setQuizState,datos}){
  const estadoNormalizado=useMemo(()=>reconstruirEstadoQuiz(quizState,datos),[quizState,datos]);
  const respuestas=estadoNormalizado.respuestas;
  const resultado=useMemo(()=>calcularPerfilMultidimensional(respuestas,datos),[respuestas,datos]);
  const questionPath=estadoNormalizado.questionPath;
  const currentQuestionId=estadoNormalizado.currentQuestionId;
  const currentIndex=Math.max(0,questionPath.indexOf(currentQuestionId));
  const q=QUIZ_DEF[currentQuestionId] || QUIZ_DEF.edad;
  const valorGuardado=respuestas[q.id];

  useEffect(()=>{
    const resultadoActual=estadoNormalizado.terminado
      ? calcularPerfilMultidimensional(respuestas,datos)
      : null;
    if(JSON.stringify(quizState)!==JSON.stringify({
      ...estadoNormalizado,
      resultado:resultadoActual,
      datosSnapshot:quizState?.datosSnapshot
    })){
      setQuizState({...estadoNormalizado,resultado:resultadoActual,datosSnapshot:quizState?.datosSnapshot});
    }
    if(resultadoActual?.perfil) onPerfilCalculado(resultadoActual.perfil,resultadoActual);
  },[estadoNormalizado.currentQuestionId,estadoNormalizado.terminado,estadoNormalizado.questionPath.join("|"),JSON.stringify(respuestas),datos.ingresos,JSON.stringify(datos.gastosFijos),JSON.stringify(datos.gastosDiscrecionales),datos.ahorroActual,JSON.stringify(datos.deudas),JSON.stringify(datos.objetivos),JSON.stringify(datos.objetivo)]);

  const rutaCompletaEstimable=useMemo(()=>{
    /*
     * La longitud futura no puede conocerse hasta contestar las preguntas que
     * abren ramas. Para evitar cálculos costosos, proyectamos un recorrido
     * representativo usando las respuestas actuales y valores conservadores
     * en las decisiones todavía desconocidas.
     */
    const r={...respuestas};
    let id=currentQuestionId;
    let count=0;
    const vistos=new Set();
    while(id && !vistos.has(id) && count<30){
      vistos.add(id);
      count++;
      if(quizNumero(r,id)==null){
        /* En una pregunta aún no respondida no inventamos una respuesta única:
           tomamos la rama que produzca el recorrido más largo de forma local. */
        const siguientes=(QUIZ_DEF[id]?.opciones||[]).map((_,i)=>{
          const rr={...r,[id]:i+1};
          return getNextQuestionId(id,rr,datos);
        }).filter(Boolean);
        id=siguientes[siguientes.length-1] || null;
      }else{
        id=getNextQuestionId(id,r,datos);
      }
    }
    return Math.max(count,currentIndex+1);
  },[respuestas,currentQuestionId,currentIndex,datos]);
  const responder=(valor)=>{
    const nuevas={...respuestas,[q.id]:valor};
    const prefijo=questionPath.slice(0,currentIndex+1);
    const idsValidos=new Set(prefijo);
    Object.keys(nuevas).forEach(id=>{
      if(!idsValidos.has(id)) delete nuevas[id];
    });

    const siguienteId=getNextQuestionId(q.id,nuevas,datos);
    const nuevoPath=[...prefijo];
    if(siguienteId) nuevoPath.push(siguienteId);

    if(!siguienteId){
      const nuevoResultado=calcularPerfilMultidimensional(nuevas,datos);
      const capacidadAlFinalizar=calcularCapacidadFinanciera(datos);
      const nuevoEstado={
        respuestas:nuevas,
        currentQuestionId:q.id,
        questionPath:nuevoPath,
        paso:nuevoPath.length-1,
        terminado:true,
        resultado:nuevoResultado,
        datosSnapshot:{
          ingresos:Number(capacidadAlFinalizar.ingresos)||0,
          deudaPendiente:(datos.deudas||[]).reduce((s,d)=>s+Number(d.pendiente||0),0),
          ahorroActual:Number(datos.ahorroActual)||0,
          capacidadMensual:Number(capacidadAlFinalizar.capacidadMensual)||0
        }
      };
      setQuizState(nuevoEstado);
      onPerfilCalculado(nuevoResultado.perfil,nuevoResultado);
      return;
    }

    setQuizState({
      respuestas:nuevas,
      currentQuestionId:siguienteId,
      questionPath:nuevoPath,
      paso:nuevoPath.length-1,
      terminado:false,
      resultado:null
    });
  };

  const anterior=()=>{
    if(currentIndex<=0) return;
    const nuevoPath=questionPath.slice(0,currentIndex);
    const previousId=nuevoPath[nuevoPath.length-1] || "edad";
    setQuizState({
      ...quizState,
      respuestas,
      currentQuestionId:previousId,
      questionPath:nuevoPath,
      paso:Math.max(0,nuevoPath.length-1),
      terminado:false,
      resultado:null
    });
  };

  const repetir=()=>{
    const inicial={
      respuestas:{},
      currentQuestionId:"edad",
      questionPath:["edad"],
      paso:0,
      terminado:false,
      resultado:null
    };
    setQuizState(inicial);
    onPerfilCalculado(null,null);
  };

  if(estadoNormalizado.terminado){
    const nombrePerfil=resultado.perfil;
    const info=PERFILES_INFO[nombrePerfil];
    const capacidadActual=calcularCapacidadFinanciera(datos);
    const snapshot=quizState?.datosSnapshot;
    const deudaPendienteActual=(datos.deudas||[]).reduce((s,d)=>s+Number(d.pendiente||0),0);
    const cambioSignificativo = !!snapshot && (()=>{
      const diffRelativo=(a,b)=> (a===0&&b===0) ? 0 : Math.abs(a-b)/Math.max(Math.abs(a),Math.abs(b),1);
      return diffRelativo(snapshot.ingresos,Number(capacidadActual.ingresos)||0)>0.20
        || diffRelativo(snapshot.deudaPendiente,deudaPendienteActual)>0.30
        || diffRelativo(snapshot.ahorroActual,Number(datos.ahorroActual)||0)>0.30
        || diffRelativo(snapshot.capacidadMensual,Number(capacidadActual.capacidadMensual)||0)>0.30;
    })();
    const dimensiones=[
      ["Edad",resultado.edad],
      ["Tolerancia al riesgo",resultado.toleranciaRiesgo],
      ["Capacidad para soportar pérdidas",resultado.capacidadRiesgo],
      ["Horizonte temporal",resultado.horizonte],
      ["Necesidad de liquidez",resultado.liquidez],
      ["Conocimientos / experiencia",resultado.experiencia]
    ];
    const confianzaColor=resultado.confianza==="Alta"?C.salu:resultado.confianza==="Media"?C.mej:C.crit;
    return (
      <div className="space-y-6">
        <div><h1 className="font-serif text-2xl font-bold readable-title">Test de perfil de riesgo</h1></div>
        <Card className="p-8" style={{borderColor:info.color+"55"}}>
          <div className="text-center">
            <div className="w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4" style={{backgroundColor:info.light}}>
              <I.shieldCheck size={28} color={info.color}/>
            </div>
            <div className="text-xs font-bold uppercase" style={{color:C.muted,letterSpacing:"0.1em"}}>Perfil final</div>
            <div className="font-serif text-3xl font-bold mt-1" style={{color:info.color}}>{nombrePerfil}</div>
            <p className="text-sm mt-4 max-w-xl mx-auto" style={{color:C.muted}}>{info.explicacion}</p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-6">
            {dimensiones.map(([label,value])=>(
              <div key={label} className="rounded-xl border p-3" style={{borderColor:C.border,backgroundColor:C.paper}}>
                <div className="flex items-center justify-between gap-3">
                  <span className="text-xs font-bold" style={{color:C.ink}}>{label}</span>
                  <span className="text-sm font-bold" style={{color:value==null?C.muted:C.navy}}>{value==null?"Sin datos":value+"/100"}</span>
                </div>
                {value!=null && <div className="h-1.5 rounded-full mt-2 overflow-hidden" style={{backgroundColor:C.bgDeepMid}}><div className="h-full rounded-full" style={{width:value+"%",backgroundColor:info.color}}/></div>}
              </div>
            ))}
          </div>

          <div className="rounded-xl border p-4 mt-5" style={{borderColor:confianzaColor+"55",backgroundColor:confianzaColor+"10"}}>
            <div className="flex items-center justify-between gap-3">
              <span className="text-xs font-bold uppercase" style={{color:C.muted,letterSpacing:"0.08em"}}>Nivel de confianza</span>
              <span className="text-sm font-bold" style={{color:confianzaColor}}>{resultado.confianza}</span>
            </div>
            {resultado.faltantes.length>0 && <p className="text-xs mt-2" style={{color:C.muted}}>Faltan datos importantes ({resultado.faltantes.join(", ")}), por lo que el resultado tiene menor confianza.</p>}
          </div>

          <div className="mt-5">
            <div className="font-serif text-lg font-bold readable-title">¿Por qué tienes este perfil?</div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
              <div className="rounded-xl p-4" style={{backgroundColor:C.saluLight}}>
                <div className="text-xs font-bold uppercase mb-2" style={{color:C.salu}}>Factores positivos</div>
                <ul className="space-y-1.5 text-xs" style={{color:C.ink}}>
                  {resultado.factoresPositivos.map((f,i)=><li key={i}>• {f}</li>)}
                </ul>
              </div>
              <div className="rounded-xl p-4" style={{backgroundColor:C.critLight}}>
                <div className="text-xs font-bold uppercase mb-2" style={{color:C.crit}}>Factores a vigilar</div>
                <ul className="space-y-1.5 text-xs" style={{color:C.ink}}>
                  {resultado.factoresNegativos.map((f,i)=><li key={i}>• {f}</li>)}
                </ul>
              </div>
            </div>
          </div>

          <div className="mt-5 rounded-xl p-4" style={{backgroundColor:C.paper,border:"1px solid "+C.border}}>
            <div className="font-serif text-lg font-bold readable-title">Factores que hemos tenido en cuenta</div>
            <ul className="grid sm:grid-cols-2 gap-1.5 mt-3 text-xs" style={{color:C.ink}}>
              {resultado.factoresTenidosEnCuenta.map((f,i)=><li key={i}>• {f}</li>)}
            </ul>
          </div>

          <div className="text-xs mt-5 p-3 rounded-lg" style={{backgroundColor:C.bgDeepMid,color:C.muted}}>
            El perfil no se determina por una única puntuación: la capacidad financiera incorpora ahorro disponible, fondo de emergencia, deuda, estabilidad de ingresos, patrimonio y necesidades de los objetivos, mientras que los conocimientos se evalúan en un bloque independiente.
          </div>

          <div className="text-center">
            {cambioSignificativo && <div className="rounded-xl p-4 mb-4 text-left" style={{backgroundColor:C.mejLight,border:"1px solid "+C.mej}}>
              <div className="flex items-start gap-2.5">
                <I.alert size={16} color={C.mej} className="mt-0.5 shrink-0"/>
                <div>
                  <b className="text-sm" style={{color:C.ink}}>Tu situación financiera ha cambiado desde que hiciste este test</b>
                  <p className="text-xs mt-1" style={{color:C.muted}}>Repetirlo puede darte un perfil más ajustado a cómo estás ahora.</p>
                </div>
              </div>
            </div>}
            <button onClick={repetir} className="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-transform hover:scale-[1.03] active:scale-[0.98]" style={{backgroundColor:C.navy,color:C.white}}>Repetir el test</button>
          </div>
        </Card>
      </div>
    );
  }

  const completadas=Math.max(0,currentIndex);
  const remainingEstimate=Math.max(1,rutaCompletaEstimable-Math.max(0,currentIndex+1));
  const progresoBase=(completadas/(completadas+remainingEstimate))*100;
  const progreso=Math.min(96,Math.max(0,progresoBase));
  return (
    <div className="space-y-6">
      <div>
        <h1 className="font-serif text-2xl font-bold readable-title">Test de perfil de riesgo</h1>
        <p className="readable-subtitle">Cuestionario adaptativo — las preguntas y el detalle del análisis cambian según tus respuestas y tu situación financiera.</p>
      </div>
      <div>
        <div className="flex items-center justify-between text-xs font-bold mb-1.5" style={{color:C.muted}}>
          <span>Pregunta {currentIndex+1}{rutaCompletaEstimable ? " · "+(rutaCompletaEstimable<=currentIndex+1 ? "recorrido final" : "~"+rutaCompletaEstimable+" máx.") : ""}</span>
          <span>{completadas} respondidas</span>
        </div>
        <ProgressBar pctValue={progreso} color={C.sand}/>
      </div>
      <FadeSwitch id={q.id+"-"+currentIndex}>
        <Card className="p-6">
          <div className="font-serif text-xl font-bold mb-2 quiz-question">{q.texto}</div>
          {q.nota && <div className="text-xs rounded-lg px-3 py-2 mb-4 inline-flex items-start gap-1.5 quiz-note"><I.info size={13} className="mt-0.5 shrink-0"/> {q.nota}</div>}
          <div className="space-y-2.5 mt-3">
            {q.opciones.map((o,i)=>(
              <button key={i} onClick={()=>responder(i+1)} className="quiz-option" aria-pressed={valorGuardado===i+1}>
                {o} <I.arrowRight size={15} color={C.muted}/>
              </button>
            ))}
          </div>
        </Card>
      </FadeSwitch>
      {currentIndex>0 && <button onClick={anterior} className="inline-flex items-center gap-1.5 text-sm font-bold" style={{color:C.muted}}><I.arrowLeft size={14}/> Pregunta anterior</button>}
    </div>
  );
}

/* ============================================================
   PANTALLA: ESTRATEGIA
   ============================================================ */
function Estrategia({perfil,onGoToPerfil=()=>{},onGoToSimulador=()=>{},setSim,ahorroDisponible,datos,onSeleccionarObjetivo}){
  const planObjetivos=useMemo(()=>calcularPlanObjetivos(datos||{}),[datos]);
  const fondo=calcularFondoEmergencia(datos||{});
  if(!perfil) return <div className="space-y-6"><div><h1 className="font-serif text-2xl font-bold readable-title">Estrategia financiera</h1></div><Card className="p-10 text-center"><I.clipboard size={32} className="mx-auto mb-3" color={C.muted}/><p className="text-sm font-bold" style={{color:C.ink}}>Todavía no has completado tu test de perfil de riesgo</p><p className="text-sm mt-1" style={{color:C.muted}}>Complétalo para integrar tu horizonte, tolerancia y capacidad financiera en la estrategia.</p><button onClick={()=>onGoToPerfil()} className="inline-flex items-center gap-2 mt-5 px-4 py-2 rounded-lg text-sm font-bold" style={{backgroundColor:C.navy,color:C.white}}>Hacer el test <I.arrowRight size={14}/></button></Card></div>;
  const info=PERFILES_INFO[perfil]||PERFILES_INFO["Moderado"];
  const principal=planObjetivos.principal;
  const deudaActiva=(datos.deudas||[]).filter(d=>Number(d.pendiente)>0);
  const fondoSuficiente=fondo.objetivo!=null && fondo.coberturaMeses!=null && fondo.coberturaMeses>=6;
  const baseEstable=planObjetivos.capacidadMensual!=null && planObjetivos.capacidadMensual>0;
  const puedeValorarInversion=fondoSuficiente && deudaActiva.length===0 && baseEstable && (!principal || principal.horizonteAniosCalculado==null || principal.horizonteAniosCalculado>=5);
  const estadoPrincipal=principal?.estadoViabilidad;
  const estadoLabel={viable:"Viable",ajustado:"Ajustado",no_viable:"No viable",pendiente:"Pendiente de datos",pendiente_capacidad:"Pendiente de capacidad",completado:"Completado"}[estadoPrincipal]||"Pendiente";
  const perfilObjetivo=principal?principal.recomendacionHorizonte:null;
  const pasos=[];
  if(planObjetivos.capacidadMensual==null) pasos.push("Introduce ingresos, gastos y cuotas de deuda para calcular tu capacidad mensual real.");
  else if(planObjetivos.capacidadMensual<=0) pasos.push(`Tu capacidad mensual actual es ${euros(planObjetivos.capacidadMensual)}. Prioriza estabilizar el presupuesto antes de aumentar compromisos.`);
  if(fondo.objetivo!=null && fondo.falta>0) pasos.push(`Refuerza el fondo de emergencia: la referencia de 6 meses es ${euros(fondo.objetivo)} y actualmente faltan ${euros(fondo.falta)}.`);
  if(deudaActiva.length>0) pasos.push(`Revisa tus deudas: tienes ${euros(planObjetivos.cuotasDeuda)}/mes en cuotas y ${euros(deudaActiva.reduce((s,d)=>s+Number(d.pendiente||0),0))} pendientes.`);
  if(principal) pasos.push(`Prioriza “${principal.nombre||OBJETIVOS_DEF.find(x=>x.id===principal.tipo)?.label||"este objetivo"}”: requiere aproximadamente ${principal.aportacionNecesaria==null?"un ritmo aún por calcular":euros(principal.aportacionNecesaria)+"/mes"}.`);
  if(planObjetivos.conflictoObjetivos) pasos.push(`Tus objetivos requieren ${euros(planObjetivos.aportacionComprometida)}/mes y tu capacidad actual es ${euros(planObjetivos.capacidadParaObjetivos)}; existe un déficit conjunto de ${euros(planObjetivos.deficitMensual)}/mes.`);
  if(planObjetivos.ejecucion?.nivel==="pendiente" && datos.habito) pasos.push(planObjetivos.ejecucion.texto);
  if(puedeValorarInversion) pasos.push(`Con la base financiera cubierta, puedes valorar una estrategia de inversión de largo plazo coherente con tu perfil ${perfil}.`);
  if(!pasos.length) pasos.push("Mantén el seguimiento periódico y revisa la estrategia cuando cambien tus ingresos, gastos, deuda u objetivos.");
  const irASimulador=()=>{if(!principal)return;onSeleccionarObjetivo&&onSeleccionarObjetivo(principal.id);setSim({inicial:principal.importeReservadoAplicado??0,mensual:principal.aportacionMensual??0,tasa:info.rentabilidad,horizonte:principal.horizonteAniosCalculado??principal.plazoAnios??0,objetivoId:principal.id});onGoToSimulador();};
  let contador=1;
  const nSituacion=contador++;
  const nAyuda=contador++;
  const nObjetivoRiesgo=principal?contador++:null;
  const nBaseInvertir=contador++;
  const nSimulacion=principal?contador++:null;
  const nSiguientePaso=contador++;
  return <div className="space-y-6"><div><h1 className="font-serif text-2xl font-bold readable-title">Estrategia financiera</h1><p className="readable-subtitle">Orientación educativa construida con tu situación financiera, tus objetivos, su horizonte y tu perfil global.</p></div>
    <Card className="p-5"><Eyebrow>{nSituacion} · Situación actual</Eyebrow><div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 mt-3"><div className="rounded-xl p-3 flex flex-col justify-between min-h-[92px] overflow-hidden" style={{backgroundColor:C.paper}}><div className="text-[10px] uppercase font-bold break-words" style={{color:C.muted}}>Capacidad mensual</div><div className="font-serif text-sm sm:text-base font-bold mt-1 break-words" style={{color:C.ink}}>{planObjetivos.capacidadMensual==null?"—":euros(planObjetivos.capacidadMensual)}</div></div><div className="rounded-xl p-3 flex flex-col justify-between min-h-[92px] overflow-hidden" style={{backgroundColor:C.paper}}><div className="text-[10px] uppercase font-bold break-words" style={{color:C.muted}}>Fondo de emergencia</div><div className="font-serif text-sm sm:text-base font-bold mt-1 break-words" style={{color:C.ink}}>{fondo.coberturaMeses==null?"—":fondo.coberturaMeses.toFixed(1)+" meses"}</div></div><div className="rounded-xl p-3 flex flex-col justify-between min-h-[92px] overflow-hidden" style={{backgroundColor:C.paper}}><div className="text-[10px] uppercase font-bold break-words" style={{color:C.muted}}>Deuda activa</div><div className="font-serif text-sm sm:text-base font-bold mt-1 break-words" style={{color:C.ink}}>{deudaActiva.length?euros(planObjetivos.cuotasDeuda)+"/mes":"Sin deuda"}</div></div><div className="rounded-xl p-3 flex flex-col justify-between min-h-[92px] overflow-hidden" style={{backgroundColor:C.paper}}><div className="text-[10px] uppercase font-bold break-words" style={{color:C.muted}}>Ahorro actual</div><div className="font-serif text-sm sm:text-base font-bold mt-1 break-words" style={{color:C.ink}}>{euros(planObjetivos.ahorroActual)}</div></div><div className="rounded-xl p-3 flex flex-col justify-between min-h-[92px] overflow-hidden" style={{backgroundColor:C.paper}}><div className="text-[10px] uppercase font-bold break-words" style={{color:C.muted}}>Perfil global</div><div className="font-serif text-sm sm:text-base font-bold mt-1 break-words" style={{color:info.color}}>{perfil}</div></div></div></Card>
    <Card className="p-5"><Eyebrow>{nAyuda} · Qué puede ayudarte ahora</Eyebrow><div className="space-y-3 mt-3">{planObjetivos.capacidadMensual==null&&<div className="rounded-xl p-4" style={{backgroundColor:C.mejLight,color:C.ink}}><b>Nos falta información.</b> Añade tus ingresos, gastos y deudas para calcular cuánto te queda libre cada mes.</div>}{planObjetivos.capacidadMensual!=null&&planObjetivos.capacidadMensual<=0&&<div className="rounded-xl p-4" style={{backgroundColor:C.critLight,color:C.ink}}><b>Ahora mismo gastas más de lo que ingresas.</b> Tu margen mensual es {euros(planObjetivos.capacidadMensual)}. Antes de ahorrar o invertir, ajusta gastos o ingresos.</div>}{fondo.objetivo!=null&&fondo.falta>0&&<div className="rounded-xl p-4" style={{backgroundColor:C.mejLight,color:C.ink}}><b>Refuerza tu colchón de emergencia.</b> Te faltan {euros(fondo.falta)} para cubrir 6 meses de gastos esenciales. Es tu prioridad antes de invertir.</div>}{deudaActiva.length>0&&<div className="rounded-xl p-4" style={{backgroundColor:C.critLight,color:C.ink}}><b>Reduce tus deudas.</b> Pagas {euros(planObjetivos.cuotasDeuda)}/mes en cuotas. Eliminarlas antes te dejará más dinero libre para tus objetivos.</div>}{principal&&<div className="rounded-xl p-4" style={{backgroundColor:C.saluLight,color:C.ink}}><b>Objetivo prioritario: {principal.nombre||"Objetivo"}</b><div className="mt-1">Te faltan {principal.importeRestante==null?"por definir":euros(principal.importeRestante)}. Necesitas aportar {principal.aportacionNecesaria==null?"por definir":euros(principal.aportacionNecesaria)+"/mes"}, y ahora mismo tienes {planObjetivos.capacidadParaObjetivos==null?"por definir":euros(planObjetivos.capacidadParaObjetivos)+"/mes"} disponibles.</div><div className="mt-2 font-bold">Estado: {estadoLabel}.</div></div>}{planObjetivos.conflictoObjetivos&&<div className="rounded-xl p-4" style={{backgroundColor:C.critLight,color:C.crit}}><b>Tus objetivos piden más de lo que puedes aportar.</b> En conjunto necesitas {euros(planObjetivos.aportacionComprometida)}/mes, pero solo tienes {euros(planObjetivos.capacidadParaObjetivos)}/mes disponibles (te faltan {euros(planObjetivos.deficitMensual)}/mes). Usa el orden de prioridad que has marcado para decidir cuál cubrir primero.</div>}{planObjetivos.ejecucion&&<div className="rounded-xl p-4" style={{backgroundColor:"rgba(14,165,233,0.06)",color:C.ink}}><b>Consejo:</b> automatiza tu aportación mensual y revisa el plan cada pocos meses; así es más fácil mantenerlo.</div>}</div></Card>
    {principal&&<Card className="p-5"><Eyebrow>{nObjetivoRiesgo} · Tu objetivo y el riesgo que encaja con él</Eyebrow><div className="font-serif text-xl font-bold mt-1" style={{color:C.ink}}>{principal.nombre||"Objetivo principal"}</div><p className="text-sm mt-2" style={{color:C.muted}}>Horizonte: {principal.horizonteAniosCalculado>0?principal.horizonteAniosCalculado.toFixed(1)+" años":"por definir"}. Orientación: <b style={{color:C.ink}}>{principal.recomendacionHorizonte.titulo}</b>.</p><p className="text-xs mt-2" style={{color:C.muted}}>{principal.recomendacionHorizonte.texto}</p>{perfilObjetivo&&perfilObjetivo.modo!=="invertir"&&<div className="mt-3 rounded-lg p-3 text-xs" style={{backgroundColor:C.mejLight,color:C.ink}}>Tu perfil global es {perfil.toLowerCase()}, pero el horizonte de este objetivo exige un tratamiento más prudente para el dinero destinado a él.</div>}</Card>}
    <Card className="p-5"><Eyebrow>{nBaseInvertir} · Tu base antes de invertir</Eyebrow>{puedeValorarInversion?<p className="text-sm mt-2" style={{color:C.muted}}>La base financiera está cubierta: fondo de emergencia suficiente, sin deuda pendiente y con capacidad mensual positiva. Puedes valorar, de forma educativa, una estrategia de largo plazo coherente con tu perfil.</p>:<p className="text-sm mt-2" style={{color:C.muted}}>La inversión a largo plazo no debe desplazar las prioridades anteriores. {fondo.falta>0?"Primero completa el colchón de emergencia. ":""}{deudaActiva.length>0?"Además existe deuda pendiente. ":""}{principal&&principal.horizonteAniosCalculado!=null&&principal.horizonteAniosCalculado<5?"Tienes un objetivo cercano que requiere especial prudencia. ":""}</p>}
      {ASIGNACION[perfil] && <div className="mt-4">
        <div className="text-xs font-bold mb-3" style={{color:C.ink}}>Asignación orientativa de activos · {perfil}</div>
        <div className="flex flex-col sm:flex-row items-center gap-5">
          <SimpleDonut data={ACTIVOS_DEF.filter(a=>(ASIGNACION[perfil][a.key]||0)>0).map(a=>({name:a.label,value:ASIGNACION[perfil][a.key],color:a.color}))} size={168} thickness={24}/>
          <div className="flex flex-col gap-1.5 w-full">{ACTIVOS_DEF.filter(a=>(ASIGNACION[perfil][a.key]||0)>0).map(a=><div key={a.key} className="flex items-center gap-1.5 text-[11px]" style={{color:C.muted}}><span className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor:a.color}}/>{a.label}: <b style={{color:C.ink}}>{ASIGNACION[perfil][a.key]}%</b></div>)}</div>
        </div>
        <p className="text-[11px] mt-3 readable-note">Distribución orientativa y educativa asociada a tu perfil {perfil.toLowerCase()}. No constituye una recomendación de inversión personalizada.</p>
      </div>}
    </Card>
    {principal&&<Card className="p-5"><Eyebrow>{nSimulacion} · Simulación del objetivo</Eyebrow><p className="text-sm mt-2" style={{color:C.muted}}>Lleva el objetivo al simulador para comparar aportación necesaria y aportación simulada. Los cambios del simulador no modifican el objetivo guardado.</p><button onClick={irASimulador} className="inline-flex items-center gap-2 mt-4 px-4 py-2.5 rounded-lg text-sm font-bold" style={{backgroundColor:C.sand,color:C.navy}}>Simular {principal.nombre||"este objetivo"} <I.arrowRight size={15}/></button></Card>}
    <Card className="p-5"><Eyebrow>{nSiguientePaso} · Tu siguiente paso</Eyebrow><div className="space-y-2.5 mt-3">{pasos.slice(0,5).map((p,i)=><div key={i} className="flex items-start gap-3 rounded-xl p-3" style={{backgroundColor:C.paper}}><div className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0" style={{backgroundColor:C.sand,color:C.navy}}>{i+1}</div><div className="text-sm" style={{color:C.ink}}>{p}</div></div>)}</div></Card>
    <div className="rounded-xl px-4 py-3 text-xs flex items-start gap-2" style={{backgroundColor:"rgba(79,70,229,0.07)",color:C.ink}}><I.info size={14} className="mt-0.5 shrink-0"/>Contenido educativo. El perfil global y la adecuación de cada objetivo son conceptos distintos. Las hipótesis del simulador no garantizan resultados ni constituyen recomendaciones de productos concretos.</div>
  </div>;
}

function crearIdObjetivo(){ return "obj_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8); }
function normalizarObjetivo(o={},index=0){
  const tipo=o.tipo || null;

function calcularCapacidadFinanciera(datos={}){

function obtenerHorizonteAnios(o={}){

function objetivoCalculado(o={}){

function calcularFondoEmergencia(datos={}){

    const esfuerzoReferencia=elegido!=null?elegido:(o.aportacionNecesaria!=null?o.aportacionNecesaria:0);

    {icon:I.target,titulo:"Vencer tu cerebro y ahorrar sin sufrir",texto:"Ahorrar para una casa o para tu nivel de vida futuro no tiene por qué hundir tu calidad de vida actual. Nuestro cerebro sufre de \"sesgo del presente\" y prefiere gastar hoy, pero la ciencia económica encontró la solución: automatizar que una parte de tus futuras subidas de sueldo o dinero extra vaya directamente al ahorro antes de que te acostumbres a gastarlo. Este método demostró multiplicar la tasa de ahorro de un 3,5% a un altísimo 13,6% en menos de 4 años, sin que los participantes sintieran ninguna pérdida en su día a día. Sistematiza tus finanzas: multiplica tu capital sin sentir que te sacrificas.",fuente:"FUENTE: Universidad de Chicago (Premio Nobel Richard Thaler y Shlomo Benartzi)."}
  ];
  return <section className="relative py-14 sm:py-20">
    <div className="absolute inset-0 pointer-events-none" style={{background:"radial-gradient(70% 55% at 50% 0%, rgba(79,70,229,.09), transparent 72%)"}}/>
    <div className="relative z-10 max-w-6xl mx-auto w-full px-4 sm:px-6">
      {/* UX: hero narrativo + experimento financiero antes de solicitar cualquier dato. */}
      <div className="grid lg:grid-cols-[1fr_.9fr] gap-10 lg:gap-14 items-center min-h-[68vh]">
        <div><div className="text-xs font-bold uppercase mb-4" style={{color:C.sand,letterSpacing:".16em"}}>Pon orden en tu dinero</div><h1 className="font-serif text-4xl sm:text-5xl lg:text-6xl font-bold leading-[1.02]" style={{color:C.ink}}>¿Sientes que tu dinero se te escapa <span style={{color:C.sand}}>y no sabes por qué?</span></h1><p className="text-base sm:text-lg mt-6 max-w-xl leading-relaxed" style={{color:C.muted}}>No llegar a fin de mes, no saber en qué se va el sueldo o sentir que la deuda nunca baja es más común de lo que parece. Aquí puedes ver tu situación con claridad y recibir un plan sencillo para empezar a ordenarla, sin tecnicismos y sin que nadie te juzgue.</p><div className="flex flex-wrap items-center gap-4 mt-8"><button onClick={onStart} className="inline-flex items-center gap-2 px-6 py-3.5 rounded-xl text-sm font-bold transition-transform hover:scale-[1.03]" style={{backgroundColor:C.sand,color:C.white}}>Ver mi situación financiera <I.arrowRight size={16}/></button><button onClick={()=>document.getElementById("evidencia")?.scrollIntoView({behavior:"smooth",block:"start"})} className="inline-flex items-center gap-2 px-5 py-3.5 rounded-xl text-sm font-bold transition-colors hover:bg-black/5" style={{color:C.ink,border:"1.5px solid rgba(79,70,229,.35)"}}>Por qué importa la salud financiera</button></div><div className="flex flex-wrap gap-4 mt-5 text-xs" style={{color:C.mutedLight}}><span className="inline-flex items-center gap-1.5"><I.checkCircle size={14} color={C.salu}/> Sin registro, gratis y en minutos</span><span className="inline-flex items-center gap-1.5"><I.chartLine size={14} color={C.exc}/> Resultados al momento</span></div></div>
        <PoderAdquisitivoSection/>
      </div>
      <HowItWorksSection/>
      <div className="mt-14 sm:mt-18"><GastoHormigaSection/></div>
      <section id="evidencia" className="mt-16 sm:mt-20 scroll-mt-24">
        <div className="max-w-3xl mx-auto text-center mb-8 sm:mb-10">
          <div className="text-xs font-bold uppercase" style={{color:C.sand,letterSpacing:".16em"}}>¿Por qué cuesta tanto ordenar el dinero? Esto dice la investigación</div>
          <p className="text-sm mt-2" style={{color:C.muted}}>No hace falta que leas esto para usar la herramienta — está aquí por si te ayuda entender por qué cuesta tanto y por qué merece la pena intentarlo.</p>

              <Card key={t.titulo} className={"p-5 sm:p-6 cursor-pointer transition-shadow"+(t.titulo==="Vencer tu cerebro y ahorrar sin sufrir"?" md:col-span-2 md:max-w-2xl md:mx-auto w-full":"")} style={{borderColor:abierta?C.sand:C.border}} onClick={()=>setExpandedIndex(abierta?null:i)}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex items-center gap-3.5 min-w-0">
                    <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style={{backgroundColor:"rgba(79,70,229,.12)"}}><Icon size={20} color={C.sand}/></div>
                    <h3 className="font-serif text-lg sm:text-xl font-bold" style={{color:C.ink}}>{t.titulo}</h3>
                  </div>
                  <div className="shrink-0 mt-1 transition-transform duration-300" style={{transform:abierta?"rotate(180deg)":"rotate(0deg)",color:C.sand}}><I.chevronDown size={18}/></div>
                </div>
                <div style={{ maxHeight: abierta ? '800px' : '0px', overflow: 'hidden', transition: 'max-height 400ms ease' }}>
                    <p className="text-sm leading-relaxed mt-4" style={{color:C.muted}}>{t.texto}</p>
                    <p className="text-[11px] leading-relaxed mt-4" style={{color:C.mutedLight}}>{t.fuente}</p>
                </div>
              </Card>
            );
          })}
        </div>
      </section>
      <div className="mt-16 sm:mt-20 rounded-3xl p-7 sm:p-10 text-center relative overflow-hidden" style={{background:"linear-gradient(135deg, #111827 0%, #1f2937 55%, #312e81 100%)",boxShadow:"0 24px 70px -35px rgba(49,46,129,.55)"}}>
        <div className="absolute -top-24 -right-20 w-64 h-64 rounded-full pointer-events-none" style={{background:"radial-gradient(circle, rgba(79,70,229,.22), transparent 65%)"}}/>
        <div className="relative z-10 max-w-2xl mx-auto"><div className="text-[10px] uppercase font-bold" style={{color:C.sand,letterSpacing:".16em"}}>Ahora te toca a ti</div><h2 className="font-serif text-3xl sm:text-4xl font-bold mt-2" style={{color:C.white}}>Da el primer paso. No hace falta que lo tengas todo claro.</h2><div className="mt-4 rounded-2xl px-5 py-4 text-left" style={{backgroundColor:"#ffffff",border:"1px solid rgba(255,255,255,.25)",boxShadow:"0 10px 30px -22px rgba(0,0,0,.45)"}}>
          <p className="cta-final-copy text-sm leading-relaxed" style={{color:"#111827",fontWeight:600}}>Es gratis, no necesitas registrarte y puedes dejarlo cuando quieras. Solo tienes que responder con sinceridad; nosotros ordenamos el resto.</p>
        </div><button onClick={onStart} className="mt-7 inline-flex items-center gap-2 px-7 py-4 rounded-xl text-sm font-bold transition-transform hover:scale-[1.03]" style={{backgroundColor:C.sand,color:C.navy}}>Comenzar mi diagnóstico <I.arrowRight size={17}/></button></div>
      </div>
    </div>
  </section>;
}

function ObjetivosFinancieros({datos,setDatos,objetivoSeleccionadoId,onEliminarSeleccionado}){
  const objetivos=normalizarObjetivos(datos);
  const [editando,setEditando]=useState(null);
  const [borrador,setBorrador]=useState(null);
  const plan=useMemo(()=>calcularPlanObjetivos(datos),[datos]);
  const guardar=()=>{
    if(!borrador) return;
    const limpio=normalizarObjetivo(borrador, objetivos.length);
    const arr=editando ? objetivos.map(o=>o.id===editando?limpio:o) : [...objetivos,limpio];
    setDatos(sincronizarObjetivos(datos,arr)); setEditando(null); setBorrador(null);
  };
  const abrirNuevo=()=>{setEditando(null);setBorrador({id:crearIdObjetivo(),tipo:null,nombre:"",importeObjetivo:null,importeReservado:null,plazoAnios:null,fechaObjetivo:null,prioridad:null,aportacionMensual:null});};
  const abrirEditar=o=>{setEditando(o.id);setBorrador({...o});};
  const eliminar=id=>{const arr=objetivos.filter(o=>o.id!==id);setDatos(sincronizarObjetivos(datos,arr));if(editando===id){setEditando(null);setBorrador(null);}if(objetivoSeleccionadoId===id) onEliminarSeleccionado&&onEliminarSeleccionado(id);};
  const inputNombre=(value,placeholder,onChange)=><input value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className="w-full rounded-lg px-3 py-2 text-sm font-bold border outline-none" style={{borderColor:C.border,color:C.ink,backgroundColor:C.paper}}/>;
  const objetivoTitulo=o=>o.nombre || (OBJETIVOS_DEF.find(x=>x.id===o.tipo)?.label || "Objetivo sin nombre");
  return <Card className="p-5 sm:p-7">
    <div className="flex items-start justify-between gap-4 mb-5">
      <div><Eyebrow>05 · Objetivos</Eyebrow><h3 className="font-serif text-xl font-bold mt-1" style={{color:C.ink}}>¿Qué quieres conseguir?</h3><p className="text-sm mt-1" style={{color:C.muted}}>Tus objetivos conectan tu situación financiera actual con el plazo, la capacidad de ahorro y la estrategia posterior.</p></div>
      <button onClick={abrirNuevo} className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold border" style={{borderColor:C.border,color:C.navy,backgroundColor:C.paper}}><I.plus size={14}/> Añadir objetivo</button>
    </div>

    {objetivos.length===0 && !borrador && <div className="rounded-xl border p-5" style={{borderColor:C.border,color:C.ink,backgroundColor:C.paper}}><div className="font-bold">Todavía no has definido ningún objetivo.</div><p className="text-sm mt-1" style={{color:C.muted}}>Empieza introduciendo qué quieres conseguir. No se ha creado ningún objetivo ni se han supuesto importes o plazos.</p><button onClick={abrirNuevo} className="mt-4 px-4 py-2 rounded-lg text-xs font-bold" style={{backgroundColor:C.sand,color:C.navy}}>Crear mi primer objetivo</button></div>}

    {borrador && <div className="mt-2 rounded-xl border p-4" style={{borderColor:C.sand,backgroundColor:C.paper}}>
      <div className="text-sm font-bold mb-1" style={{color:C.ink}}>{editando?"Editar objetivo":"Nuevo objetivo"}</div>
      <div className="text-xs mb-4" style={{color:C.muted}}>Las categorías solo sirven para clasificarlo. No rellenan automáticamente los datos del objetivo.</div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
        {OBJETIVOS_DEF.map(o=>{const active=borrador.tipo===o.id;return <button key={o.id} onClick={()=>setBorrador({...borrador,tipo:o.id})} className="flex flex-col items-center gap-1 p-2 rounded-lg border text-center" style={{borderColor:active?C.sand:C.border,backgroundColor:active?C.sandLight:C.paper}}><o.icon size={17} color={active?C.navy:C.muted}/><span className="text-[10px] font-bold" style={{color:C.ink}}>{o.label}</span></button>})}
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div><label className="block text-sm font-bold mb-2" style={{color:C.ink}}>Nombre del objetivo</label>{inputNombre(borrador.nombre,"Ej. Entrada de vivienda",v=>setBorrador({...borrador,nombre:v}))}</div>
        <NumberField label="¿Cuánto dinero necesitas?" value={borrador.importeObjetivo} onChange={v=>setBorrador({...borrador,importeObjetivo:v||null})}/>
        <NumberField label="¿Cuánto tienes ya reservado?" value={borrador.importeReservado} onChange={v=>setBorrador({...borrador,importeReservado:v||null})}/>
        <NumberField label="¿En cuánto tiempo quieres conseguirlo?" suffix="años" value={borrador.plazoAnios} onChange={v=>setBorrador({...borrador,plazoAnios:v||null})}/>
        <div><label className="block text-sm font-bold mb-2" style={{color:C.ink}}>O fecha objetivo</label><input type="date" value={borrador.fechaObjetivo||""} onChange={e=>setBorrador({...borrador,fechaObjetivo:e.target.value||null})} className="w-full rounded-lg px-3 py-2 text-sm font-bold border outline-none" style={{borderColor:C.border,color:C.ink,backgroundColor:C.paper}}/><p className="text-[11px] mt-1" style={{color:C.muted}}>Puedes indicar años o una fecha concreta.</p></div>
        <div><label className="block text-sm font-bold mb-2" style={{color:C.ink}}>Prioridad</label><div className="grid grid-cols-3 gap-2">{PRIORIDADES_OBJETIVO.map(pr=><button key={pr} onClick={()=>setBorrador({...borrador,prioridad:pr})} className="px-2 py-2 rounded-lg border text-xs font-bold" style={{borderColor:borrador.prioridad===pr?C.sand:C.border,backgroundColor:borrador.prioridad===pr?C.sandLight:C.paper,color:C.ink}}>{PRIORIDAD_LABEL[pr]}</button>)}</div><p className="text-[11px] mt-1" style={{color:C.muted}}>Necesaria para decidir preferencias cuando varios objetivos compiten por la misma capacidad.</p></div>
        <div>
          <NumberField label="¿Cuánto quieres aportar cada mes?" value={borrador.aportacionMensual} onChange={v=>setBorrador({...borrador,aportacionMensual:v==null?null:v})} hint="Opcional: si lo dejas vacío, solo calcularemos cuánto necesitarías aportar."/>
          {plan.capacidadParaObjetivos>0 && <div className="mt-2">
            <div className="text-[11px] font-bold mb-1" style={{color:C.muted}}>O destina un % de tu ahorro mensual ({euros(plan.capacidadParaObjetivos)}/mes)</div>
            <div className="grid grid-cols-4 gap-1.5">
              {[25,50,75,100].map(p=><button key={p} type="button" onClick={()=>setBorrador({...borrador,aportacionMensual:Math.round(plan.capacidadParaObjetivos*p/100)})} className="px-2 py-1.5 rounded-lg border text-xs font-bold" style={{borderColor:Number(borrador.aportacionMensual)===Math.round(plan.capacidadParaObjetivos*p/100)?C.sand:C.border,backgroundColor:Number(borrador.aportacionMensual)===Math.round(plan.capacidadParaObjetivos*p/100)?C.sandLight:C.paper,color:C.ink}}>{p}%</button>)}
            </div>
          </div>}
        </div>
      </div>
      {borrador.plazoAnios>0 && <div className="mt-4 rounded-lg p-3 text-xs" style={{backgroundColor:recomendacionObjetivoPorHorizonte(borrador.plazoAnios).modo==="invertir"?C.saluLight:C.sandLight,color:C.ink}}><b>{recomendacionObjetivoPorHorizonte(borrador.plazoAnios).titulo}.</b> {recomendacionObjetivoPorHorizonte(borrador.plazoAnios).texto}</div>}
      <div className="flex gap-2 mt-4"><button onClick={guardar} className="px-4 py-2 rounded-lg text-xs font-bold" style={{backgroundColor:C.sand,color:C.navy}}>Guardar objetivo</button><button onClick={()=>{setBorrador(null);setEditando(null)}} className="px-4 py-2 rounded-lg text-xs font-bold border" style={{borderColor:C.border,color:C.ink}}>Cancelar</button></div>
    </div>}

    <div className="space-y-3 mt-4">
      {plan.objetivos.map(o=>{
        const faltaDatos=[];
        if(!o.nombre && !o.tipo) faltaDatos.push("nombre o categoría");
        if(o.importeObjetivo==null) faltaDatos.push("importe");
        if(o.importeReservado==null) faltaDatos.push("ahorro reservado");
        if(o.plazoAnios==null || o.plazoAnios<=0) faltaDatos.push("plazo");
        if(o.prioridad==null) faltaDatos.push("prioridad");
        const deficitObjetivo=o.aportacionMensual!=null && plan.capacidadParaObjetivos!=null ? Math.max(0,o.aportacionMensual-plan.capacidadParaObjetivos) : null;
        return <div key={o.id} className="rounded-xl border p-4" style={{borderColor:C.border,backgroundColor:C.paper}}>
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0"><div className="flex flex-wrap items-center gap-2"><b className="text-sm" style={{color:C.ink}}>{objetivoTitulo(o)}</b>{o.prioridad?<span className="text-[10px] uppercase font-bold px-2 py-1 rounded-full" style={{backgroundColor:C.sandLight,color:C.navy}}>{PRIORIDAD_LABEL[o.prioridad]}</span>:<span className="text-[10px] uppercase font-bold px-2 py-1 rounded-full" style={{backgroundColor:C.critLight,color:C.crit}}>Prioridad por definir</span>}<span className="text-[10px] uppercase font-bold" style={{color:C.muted}}>{o.horizonteCategoria}</span>{o.estadoViabilidad && <span className="text-[10px] uppercase font-bold px-2 py-1 rounded-full" style={{backgroundColor:o.estadoViabilidad==="viable"||o.estadoViabilidad==="completado"?C.saluLight:o.estadoViabilidad==="ajustado"?C.mejLight:C.critLight,color:o.estadoViabilidad==="viable"||o.estadoViabilidad==="completado"?C.salu:o.estadoViabilidad==="ajustado"?C.mej:C.crit}}>{({viable:"Viable",ajustado:"Ajustado",no_viable:"No viable",pendiente:"Pendiente",pendiente_capacidad:"Pendiente",completado:"Completado"})[o.estadoViabilidad]}</span>}</div>
              <div className="text-xs mt-1" style={{color:C.muted}}>{o.importeObjetivo!=null?`${euros(o.importeReservadoAplicado)} / ${euros(o.importeObjetivo)}`:"Importe por definir"} · {o.fechaObjetivo && !isNaN(new Date(o.fechaObjetivo+"T00:00:00").getTime())?`fecha ${new Date(o.fechaObjetivo+"T00:00:00").toLocaleDateString("es-ES")}`:(o.horizonteAniosCalculado>0?`${o.horizonteAniosCalculado.toFixed(1)} años`:"plazo por definir")}</div>
              {faltaDatos.length>0 && <div className="mt-2 text-xs" style={{color:C.crit}}>Completa {faltaDatos.join(", ")} para poder evaluar completamente este objetivo.</div>}
              <div className="mt-2 inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[10px] font-bold" style={{backgroundColor:o.recomendacionHorizonte.modo==="invertir"?C.saluLight:o.recomendacionHorizonte.modo==="ahorrar"?C.sandLight:"rgba(14,165,233,0.08)",color:C.ink}}><I.info size={12}/>{o.recomendacionHorizonte.titulo}</div>
            </div>
            <div className="flex gap-2 shrink-0"><button onClick={()=>abrirEditar(o)} style={{color:C.navy}}><I.edit size={15}/></button><button onClick={()=>eliminar(o.id)} style={{color:C.crit}}><I.trash size={15}/></button></div>
          </div>
          {o.importeObjetivo!=null && <>
            <div className="h-1.5 rounded-full mt-3 overflow-hidden" style={{backgroundColor:C.bgDeepMid}}><div className="h-full rounded-full" style={{width:o.progreso+"%",backgroundColor:C.salu}}/></div>
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mt-3 text-xs"><div><span style={{color:C.muted}}>Progreso</span><b className="block" style={{color:C.ink}}>{pct(o.progreso,0)}</b></div><div><span style={{color:C.muted}}>Restante</span><b className="block" style={{color:C.ink}}>{o.importeRestante==null?"—":euros(o.importeRestante)}</b></div><div><span style={{color:C.muted}}>Necesario</span><b className="block" style={{color:C.ink}}>{o.aportacionNecesaria==null?"—":euros(o.aportacionNecesaria)+"/mes"}</b></div><div><span style={{color:C.muted}}>Previsto</span><b className="block" style={{color:C.ink}}>{o.aportacionMensual==null?"—":euros(o.aportacionMensual)+"/mes"}</b></div><div><span style={{color:C.muted}}>Capacidad</span><b className="block" style={{color:C.ink}}>{plan.capacidadParaObjetivos==null?"—":euros(plan.capacidadParaObjetivos)+"/mes"}</b></div></div>
            {o.aportacionMensual!=null && plan.capacidadParaObjetivos!=null && deficitObjetivo>0 && <div className="mt-3 rounded-lg p-3 text-xs" style={{backgroundColor:C.critLight,color:C.crit}}><b>Déficit de capacidad: {euros(deficitObjetivo)}/mes.</b> La aportación prevista supera la capacidad mensual calculada con tus ingresos, gastos y deudas.</div>}
            {o.aportacionMensual!=null && o.aportacionNecesaria!=null && <div className="mt-2 text-xs" style={{color:o.aportacionMensual>=o.aportacionNecesaria?C.salu:C.crit}}>{o.aportacionMensual>=o.aportacionNecesaria?"La aportación indicada cubre el ritmo necesario para el plazo elegido.":`Con la aportación indicada faltan ${euros(o.aportacionNecesaria-o.aportacionMensual)}/mes respecto al ritmo necesario.`}</div>}
            <div className="mt-3 rounded-lg p-3 text-xs" style={{backgroundColor:o.recomendacionHorizonte.modo==="invertir"?C.saluLight:o.recomendacionHorizonte.modo==="ahorrar"?C.sandLight:"rgba(14,165,233,0.06)",color:C.ink}}><b>{o.recomendacionHorizonte.titulo}.</b> {o.recomendacionHorizonte.texto}</div>
          </>}
        </div>
      })}
    </div>

    {objetivos.length>0 && <div className="mt-5 grid sm:grid-cols-3 gap-3">
      <div className="rounded-xl p-4" style={{backgroundColor:C.saluLight}}><div className="text-[10px] uppercase font-bold" style={{color:C.salu}}>Capacidad mensual</div><div className="font-serif text-xl font-bold mt-1" style={{color:C.ink}}>{plan.capacidadParaObjetivos==null?"Pendiente":euros(plan.capacidadParaObjetivos)+"/mes"}</div><div className="text-xs mt-1" style={{color:C.muted}}>Ingresos − gastos fijos − discrecionales − deudas.</div></div>
      <div className="rounded-xl p-4" style={{backgroundColor:plan.deficitMensual>0?C.critLight:C.saluLight}}><div className="text-[10px] uppercase font-bold" style={{color:plan.deficitMensual>0?C.crit:C.salu}}>Aportaciones previstas</div><div className="font-serif text-xl font-bold mt-1" style={{color:C.ink}}>{euros(plan.aportacionComprometida)}/mes</div><div className="text-xs mt-1" style={{color:C.muted}}>{plan.deficitMensual==null?"Completa ingresos y gastos para compararlas.":plan.deficitMensual>0?`Déficit: ${euros(plan.deficitMensual)}/mes.`:`Dentro de la capacidad actual.`}</div></div>
      <div className="rounded-xl p-4" style={{backgroundColor:C.paper,border:"1px solid "+C.border}}><div className="text-[10px] uppercase font-bold" style={{color:C.navy}}>Ritmo necesario</div><div className="font-serif text-xl font-bold mt-1" style={{color:C.ink}}>{euros(plan.aportacionNecesariaTotal)}/mes</div><div className="text-xs mt-1" style={{color:C.muted}}>{plan.deficitRitmoElegido>0?`Tus aportaciones quedan ${euros(plan.deficitRitmoElegido)}/mes por debajo del ritmo necesario.`:"Ritmo cubierto con las aportaciones previstas."}</div></div>
    </div>}
    {plan.principal && <div className="mt-4 text-xs" style={{color:C.muted}}><b style={{color:C.ink}}>Objetivo principal:</b> {objetivoTitulo(plan.principal)}. Se ha determinado por prioridad y, después, por plazo y capital pendiente.</div>}
    {plan.prioridadSinDefinir && objetivos.length>1 && <div className="mt-3 rounded-lg p-3 text-xs" style={{backgroundColor:C.critLight,color:C.crit}}><b>Define las prioridades.</b> Hay objetivos sin prioridad; hasta que las indiques, la herramienta no asigna silenciosamente preferencia a ninguno.</div>}
    {plan.ejecucion && <div className="mt-3 rounded-lg p-3 text-xs" style={{backgroundColor:"rgba(14,165,233,0.06)",color:C.ink}}><b>Capacidad de ejecución:</b> {plan.ejecucion.texto}</div>}
    {plan.conflictoObjetivos && <div className="mt-3 rounded-xl p-3 text-xs" style={{backgroundColor:C.critLight,color:C.crit}}><b>Conflicto entre objetivos:</b> tus aportaciones previstas suman {euros(plan.aportacionComprometida)}/mes y la capacidad conjunta es {euros(plan.capacidadParaObjetivos)}/mes. Déficit conjunto: {euros(plan.deficitMensual)}/mes.</div>}
    <div className="mt-3 rounded-xl p-3 text-xs" style={{backgroundColor:"rgba(14,165,233,0.06)",color:C.ink}}><b>Cómo lo calculamos:</b> usamos tus ingresos, gastos, deudas y ahorro actual. Es una orientación educativa, no una garantía de resultados.</div>
  </Card>;
}

function Diagnostico({datos,setDatos,onFinalizar,objetivoSeleccionadoId,onEliminarSeleccionado}){
  /* UX: wizard de 3 pasos. Los datos siguen viviendo en `datos` y se persisten
     exactamente por los mecanismos existentes; solo cambia cuándo se muestran. */
  const [paso,setPaso]=useState(1);
  useEffect(()=>{ window.scrollTo({top:0,left:0,behavior:"smooth"}); }, [paso]);
  const [subPasoRedSeguridad,setSubPasoRedSeguridad]=useState(()=> datos.deudas.some(d=>Number(d.pendiente)>0||d.nombre||Number(d.cuota)>0||Number(d.tasa)>0) ? "listaDeudas" : "colchon");
  const cuotasDeuda=calcularCapacidadFinanciera(datos).cuotasDeuda;
  const totalIngresos=(Number(datos.ingresos)||0)+(Number(datos.otrosIngresos)||0);
  const gastosFijos=totalMensual(datos.gastosFijos);
  const gastosDisc=totalMensual(datos.gastosDiscrecionales);
  const necesidades=gastosFijos+cuotasDeuda;
  const deseos=gastosDisc;
  const ahorroReal=totalIngresos-necesidades-deseos;
  const ratioAhorro=totalIngresos>0?ahorroReal/totalIngresos:0;
  const fondo=calcularFondoEmergencia(datos);
  const objetivoFondo=fondo.objetivo==null?0:fondo.objetivo;
  const estado=estadoAhorro(ratioAhorro);
  const puedePaso2=Number(datos.ingresos)>0;
  const avanzar=()=>setPaso(p=>Math.min(3,p+1));
  const retroceder=()=>setPaso(p=>Math.max(1,p-1));
  const addDeuda=()=>setDatos({...datos,deudas:[...datos.deudas,{nombre:"",pendiente:0,cuota:0,tasa:0}]});
  const removeDeuda=(i)=>setDatos({...datos,deudas:datos.deudas.filter((_,idx)=>idx!==i)});
  const updateDeuda=(i,field,val)=>{const arr=[...datos.deudas];arr[i]={...arr[i],[field]:val};setDatos({...datos,deudas:arr});};

  return (
    <section className="py-16 sm:py-24 relative">
      <div className="max-w-6xl mx-auto px-4 sm:px-6">
        <div className="max-w-3xl mb-8 section-intro">
          <Eyebrow>Diagnóstico financiero</Eyebrow>
          <h2 className="font-serif text-3xl sm:text-4xl font-bold mt-2" style={{color:C.ink}}>Construye tu foto financiera, paso a paso</h2>
          <p className="text-sm sm:text-base mt-3" style={{color:C.muted}}>Empezamos por lo esencial y añadimos detalle solo cuando lo necesitas. Tus cálculos se actualizan en cada paso.</p>
        </div>

        {/* UX: progreso visible y accionable. */}
        <div className="mb-6">
          <div className="flex items-center justify-between text-xs font-bold mb-2" style={{color:C.muted}}>
            <span>Paso {paso} de 3</span><span>{paso===1?"Tu punto de partida":paso===2?"Tu presupuesto":"Tu red de seguridad"}</span>
          </div>
          <div className="h-2 rounded-full overflow-hidden" style={{backgroundColor:C.bgDeepMid}}>
            <div className="h-full rounded-full transition-all duration-300" style={{width:(paso/3*100)+"%",backgroundColor:C.sand}}/>
          </div>
          <div className="grid grid-cols-3 gap-2 mt-3 text-[11px]">
            {["Ingresos y control","Gastos y ahorro","Colchón y deuda"].map((label,i)=><button key={label} onClick={()=>{if(i===0||puedePaso2||i<paso) setPaso(i+1)}} className="text-left font-bold" style={{color:paso===i+1?C.ink:C.muted}}>{i+1}. {label}</button>)}
          </div>
        </div>

        {paso===1 && <Card className="p-5 sm:p-7">
          <div className="flex items-start justify-between gap-4 mb-6">
            <div><Eyebrow>01 · Tu punto de partida</Eyebrow><h3 className="font-serif text-xl font-bold mt-1" style={{color:C.ink}}>Empecemos por lo que entra</h3><p className="text-sm mt-1" style={{color:C.muted}}>Solo necesitamos tus ingresos netos y cuánto control sientes que tienes.</p></div>
            <div className="w-9 h-9 rounded-xl flex items-center justify-center" style={{backgroundColor:"rgba(16,185,129,0.08)"}}><I.wallet size={17} color={C.salu}/></div>
          </div>
          <div className="max-w-sm"><NumberField label="Ingresos mensuales netos" value={datos.ingresos} onChange={v=>setDatos({...datos,ingresos:v})}/></div>
          <div className="max-w-sm mt-4"><NumberField label="Otros ingresos" value={datos.otrosIngresos} onChange={v=>setDatos({...datos,otrosIngresos:v})} hint="Opcional: becas, ayudas, rentas, etc."/></div>
          <div className="mt-6">
            <label className="block text-sm font-bold mb-2" style={{color:C.ink}}>¿Cómo describirías tu relación con el dinero hoy?</label>
            <p className="text-xs mb-3" style={{color:C.muted}}>No hay una respuesta correcta. Esto nos ayuda a adaptar el acompañamiento.</p>
            <div className="grid sm:grid-cols-3 gap-2">
              {["No tengo ni idea de a dónde va","Más o menos controlado, pero sin apuntar nada","Todo apuntado y bajo control"].map(h=><button key={h} onClick={()=>setDatos({...datos,habito:h})} className="text-left px-3.5 py-3 rounded-lg border text-sm font-medium transition-all hover:-translate-y-0.5" style={{borderColor:datos.habito===h?C.sand:C.border,backgroundColor:datos.habito===h?C.sandLight:C.paper,color:C.ink}}>{h}</button>)}
            </div>
          </div>
          <div className="flex justify-end mt-6"><button disabled={!puedePaso2} onClick={avanzar} className="inline-flex items-center gap-2 px-5 py-3 rounded-xl text-sm font-bold disabled:opacity-40 disabled:cursor-not-allowed" style={{backgroundColor:C.sand,color:C.navy}}>Ver mi primer avance <I.arrowRight size={16}/></button></div>
        </Card>}

        {paso===2 && <div className="space-y-5">
          <Card className="p-5 sm:p-7">
            <div className="mb-5"><Eyebrow>02 · Tu presupuesto</Eyebrow><h3 className="font-serif text-xl font-bold mt-1" style={{color:C.ink}}>¿En qué se va tu dinero?</h3><p className="text-sm mt-1" style={{color:C.muted}}>Introduce primero los gastos que conozcas. Puedes volver y afinarlos después.</p></div>
            <GastosTabs datos={datos} setDatos={setDatos}/>
            {/* UX: momento WOW inmediatamente después de ingresos + gastos básicos. */}
            <div className="mt-6 rounded-2xl p-4 sm:p-5" style={{backgroundColor:C.sandLight,border:"1px solid rgba(79,70,229,.16)"}}>
              <div className="flex items-start gap-3">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{backgroundColor:C.surface}}><I.sparkles size={18} color={C.sand}/></div>
                <div>
                  <div className="text-xs font-bold uppercase" style={{color:C.sand,letterSpacing:"0.08em"}}>Tu primer momento de valor</div>
                  <div className="font-serif text-xl font-bold mt-1" style={{color:C.ink}}>{euros(ahorroReal)} al mes de margen</div>
                  <p className="text-sm mt-1" style={{color:C.muted}}>Con lo que has introducido hasta ahora, este sería tu ahorro disponible antes de entrar en el detalle de colchón y deuda.</p>
                  <div className="mt-3 flex flex-wrap gap-3 text-xs font-bold"><span style={{color:C.ink}}>Ahorro: {pct(ratioAhorro*100)}</span><span style={{color:C.muted}}>Gastos: {euros(necesidades+deseos)}/mes</span></div>
                </div>
              </div>
            </div>
          </Card>
          <div className="flex items-center justify-between gap-3"><button onClick={retroceder} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold border" style={{borderColor:C.border,color:C.ink,backgroundColor:C.paper}}><I.arrowLeft size={15}/> Atrás</button><button onClick={avanzar} className="inline-flex items-center gap-2 px-5 py-3 rounded-xl text-sm font-bold" style={{backgroundColor:C.sand,color:C.navy}}>Continuar <I.arrowRight size={16}/></button></div>
        </div>}

        {paso===3 && <div className="space-y-5">
          <Card className="p-5 sm:p-7">
            <div className="flex items-start justify-between gap-4 mb-5">
              <div><Eyebrow>03 · Tu red de seguridad</Eyebrow><h3 className="font-serif text-xl font-bold mt-1" style={{color:C.ink}}>Colchón y deuda, sin juicios</h3><p className="text-sm mt-1" style={{color:C.muted}}>Vamos paso a paso: primero tu colchón, después tus deudas si las tienes.</p></div>
              <div className="w-9 h-9 rounded-xl flex items-center justify-center" style={{backgroundColor:"rgba(14,165,233,0.08)"}}><I.shieldCheck size={17} color={C.exc}/></div>
            </div>

            {subPasoRedSeguridad==="colchon" && <>
              <div className="rounded-xl p-4 mb-4" style={{backgroundColor:C.paper,border:"1px solid "+C.border}}>
                <div className="text-sm font-bold" style={{color:C.ink}}>¿Qué es el colchón financiero?</div>
                <p className="text-xs mt-1" style={{color:C.muted}}>Es el dinero que tienes ahorrado y disponible para imprevistos (una reparación, quedarte sin ingresos unos meses...), sin tocar inversiones ni pedir prestado. Cuantos más meses de gastos cubra, más tranquilidad tienes.</p>
              </div>
              <NumberField label="Ahorro actual disponible" value={datos.ahorroActual} onChange={v=>setDatos({...datos,ahorroActual:v})}/>
              <div className="mt-5 rounded-xl p-4" style={{backgroundColor:C.saluLight}}>
                <div className="text-sm font-bold" style={{color:C.ink}}>Tu red de seguridad</div>
                <div className="mt-1 text-sm" style={{color:C.muted}}>{fondo.coberturaMeses==null?"Cuando tengamos tus gastos esenciales podremos estimarla.":`Con lo que tienes hoy, tu colchón cubre aproximadamente ${fondo.coberturaMeses.toFixed(1)} meses de gastos esenciales.`}</div>
              </div>
              <div className="flex justify-end mt-5"><button onClick={()=>setSubPasoRedSeguridad("preguntaDeuda")} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold" style={{backgroundColor:C.sand,color:C.navy}}>Continuar <I.arrowRight size={15}/></button></div>
            </>}

            {subPasoRedSeguridad==="preguntaDeuda" && <>
              <button onClick={()=>setSubPasoRedSeguridad("colchon")} className="inline-flex items-center gap-1.5 text-xs font-bold mb-3" style={{color:C.muted}}><I.arrowLeft size={13}/> Volver al colchón</button>
              <div className="text-sm font-bold mb-2" style={{color:C.ink}}>¿Tienes alguna deuda (que no sea tu hipoteca)?</div>
              <p className="text-xs mb-4" style={{color:C.muted}}>Por ejemplo: préstamo de coche, de estudios, tarjeta de crédito u otro préstamo personal.</p>
              <div className="flex flex-wrap gap-2">
                <button onClick={()=>setSubPasoRedSeguridad("listaDeudas")} className="px-4 py-2.5 rounded-xl border text-sm font-bold" style={{borderColor:C.border,backgroundColor:C.paper,color:C.ink}}>Sí, tengo alguna deuda</button>
                <button onClick={()=>{setDatos({...datos,deudas:[]});setSubPasoRedSeguridad("sinDeuda");}} className="px-4 py-2.5 rounded-xl border text-sm font-bold" style={{borderColor:C.border,backgroundColor:C.paper,color:C.ink}}>No tengo deudas</button>
              </div>
            </>}

            {subPasoRedSeguridad==="sinDeuda" && <>
              <button onClick={()=>setSubPasoRedSeguridad("preguntaDeuda")} className="inline-flex items-center gap-1.5 text-xs font-bold mb-3" style={{color:C.muted}}><I.arrowLeft size={13}/> Volver</button>
              <div className="rounded-xl p-4 text-sm" style={{backgroundColor:C.paper,border:"1px solid "+C.border,color:C.muted}}>Perfecto, seguimos sin deudas que gestionar.</div>
            </>}

            {subPasoRedSeguridad==="listaDeudas" && <>
              <button onClick={()=>setSubPasoRedSeguridad("preguntaDeuda")} className="inline-flex items-center gap-1.5 text-xs font-bold mb-3" style={{color:C.muted}}><I.arrowLeft size={13}/> Volver</button>
              <div className="flex items-center justify-between gap-3 mb-3"><div><div className="text-sm font-bold" style={{color:C.ink}}>Deudas pendientes</div><div className="text-xs mt-1" style={{color:C.muted}}>Añade o marca las que tengas.</div></div><button onClick={addDeuda} className="inline-flex items-center gap-1.5 text-xs font-bold" style={{color:C.sand}}><I.plus size={14}/> Añadir deuda</button></div>
              <div className="space-y-3">
                {datos.deudas.filter(d=>Number(d.pendiente)>0||d.nombre||Number(d.cuota)>0||Number(d.tasa)>0).map((d)=>{
                  const originalIndex=datos.deudas.indexOf(d);
                  return <div key={originalIndex} className="rounded-xl p-3.5 border" style={{backgroundColor:C.paper,border:"1px solid "+C.border}}>
                    <div className="flex items-center justify-between gap-2 mb-3"><input type="text" placeholder="Nombre (ej. préstamo coche)" value={d.nombre} onChange={e=>updateDeuda(originalIndex,"nombre",e.target.value)} className="flex-1 min-w-0 text-sm font-bold border-none outline-none bg-transparent" style={{color:C.ink}}/><button onClick={()=>removeDeuda(originalIndex)} className="shrink-0" style={{color:C.crit}} aria-label="Eliminar deuda"><I.trash size={15}/></button></div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">{[["pendiente","Pendiente €"],["cuota","Cuota €/mes"],["tasa","Interés %"]].map(([field,lbl])=><div key={field}><label className="text-[10px] font-bold uppercase" style={{color:C.muted}}>{lbl}</label><input type="number" inputMode="decimal" value={d[field]===0?"":d[field]} onChange={e=>updateDeuda(originalIndex,field,e.target.value===""?0:Math.max(0,Number(e.target.value)))} placeholder="0" className="w-full rounded-lg px-2 py-2 text-sm font-bold border outline-none" style={{borderColor:C.border,color:C.ink,backgroundColor:C.paper}}/></div>)}</div>
                  </div>
                })}
              </div>
              {datos.deudas.filter(d=>Number(d.pendiente)>0||d.nombre||Number(d.cuota)>0||Number(d.tasa)>0).length===0&&<div className="rounded-xl p-4 text-xs mt-3" style={{backgroundColor:C.paper,border:"1px solid "+C.border,color:C.muted}}>Añade tu primera deuda con el botón de arriba.</div>}
            </>}
          </Card>
          <ObjetivosFinancieros datos={datos} setDatos={setDatos} objetivoSeleccionadoId={objetivoSeleccionadoId} onEliminarSeleccionado={onEliminarSeleccionado}/>
          <div className="flex items-center justify-between gap-3"><button onClick={retroceder} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold border" style={{borderColor:C.border,color:C.ink,backgroundColor:C.paper}}><I.arrowLeft size={15}/> Atrás</button><button onClick={onFinalizar} className="inline-flex justify-center items-center gap-2 px-5 py-3 rounded-xl text-sm font-bold" style={{backgroundColor:C.sand,color:C.navy}}>Ver mi salud financiera <I.arrowRight size={16}/></button></div>
        </div>}

        <div className="mt-6"><Card className="p-4"><div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
          <div><div className="text-[10px] uppercase font-bold" style={{color:C.muted}}>Ingresos</div><b style={{color:C.ink}}>{euros(totalIngresos)}</b></div>
          <div><div className="text-[10px] uppercase font-bold" style={{color:C.muted}}>Gastos</div><b style={{color:C.ink}}>{euros(necesidades+deseos)}</b></div>
          <div><div className="text-[10px] uppercase font-bold" style={{color:C.muted}}>Margen mensual</div><b style={{color:ahorroReal>=0?C.salu:C.mej}}>{euros(ahorroReal)}</b></div>
          <div><div className="text-[10px] uppercase font-bold" style={{color:C.muted}}>Estado</div><Badge estado={estado}/></div>
        </div></Card></div>
      </div>
    </section>
  );
}

const CALCULADORA_DOCUMENTO = "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Prueba nuestras calculadoras</title>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js\"><\/script>\n<style>\n  /* ============================================================\n     SISTEMA DE DISEÑO — extraído de \"Salud Financiera\" (Archivo Maestro)\n     ============================================================ */\n  :root{\n    --bg:#f5f6fa;\n    --surface:#ffffff;\n    --surface-soft:#fafafa;\n    --primary:#4f46e5;\n    --primary-dark:#3730a3;\n    --primary-soft:#eef0ff;\n    --navy:#312e81;\n    --green:#10b981;\n    --green-soft:#eafaf4;\n    --blue:#0ea5e9;\n    --blue-soft:#eaf7fd;\n    --amber:#f59e0b;\n    --amber-soft:#fff7e6;\n    --danger:#ef4444;\n    --danger-soft:#fff0f0;\n    --text:#374151;\n    --text-strong:#1e1e2e;\n    --muted:#6b7280;\n    --border:#e5e7eb;\n    --header-bg:#0b0f1a;\n    --insight-bg:#312e81;\n    --insight-text:#c7d2fe;\n    --shadow-soft: 0 1px 3px rgba(30,30,46,0.05), 0 8px 24px rgba(30,30,46,0.05);\n    --shadow-soft-hover: 0 4px 16px rgba(79,70,229,0.12);\n    --font-sans: ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n    --font-serif: ui-serif, Georgia, Cambria, \"Times New Roman\", Times, serif;\n  }\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{\n    margin:0;\n    font-family:var(--font-sans);\n    background:linear-gradient(180deg,#f1f3f9 0%,#f5f6fa 22%,#f8f9fc 52%,#f3f5fa 78%,#eef1f8 100%);\n    color:var(--text);\n    padding:0 0 60px;\n    position:relative;\n  }\n\n  /* ---- Patrón geométrico de líneas finas, adaptado al fondo claro del original ---- */\n  body::before{\n    content:\"\";\n    position:fixed;\n    inset:0;\n    pointer-events:none;\n    z-index:0;\n    opacity:0.5;\n    background-image:\n      repeating-linear-gradient(30deg, rgba(49,46,129,0.035) 0px, rgba(49,46,129,0.035) 1px, transparent 1px, transparent 96px),\n      repeating-linear-gradient(-30deg, rgba(49,46,129,0.035) 0px, rgba(49,46,129,0.035) 1px, transparent 1px, transparent 96px),\n      repeating-linear-gradient(90deg, rgba(49,46,129,0.02) 0px, rgba(49,46,129,0.02) 1px, transparent 1px, transparent 96px);\n    mask-image:radial-gradient(120% 100% at 50% 0%, #000 0%, rgba(0,0,0,0.5) 55%, transparent 90%);\n    -webkit-mask-image:radial-gradient(120% 100% at 50% 0%, #000 0%, rgba(0,0,0,0.5) 55%, transparent 90%);\n  }\n\n  /* ---- Resplandores de color muy tenues para dar profundidad, sin volver el fondo un lienzo blanco ---- */\n  .bg-blob{\n    position:fixed;\n    border-radius:9999px;\n    filter:blur(120px);\n    pointer-events:none;\n    z-index:0;\n    will-change:transform;\n  }\n  .blob-a{ width:520px; height:520px; top:-180px; left:-160px; background:var(--primary); opacity:0.28; animation:blobFloatA 26s ease-in-out infinite; }\n  .blob-b{ width:440px; height:440px; bottom:-160px; right:-140px; background:var(--blue); opacity:0.18; animation:blobFloatB 30s ease-in-out infinite; }\n  .blob-c{ width:380px; height:380px; top:40%; right:-160px; background:var(--green); opacity:0.10; animation:blobFloatC 28s ease-in-out infinite; }\n  @keyframes blobFloatA { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(60px,-40px) scale(1.12); } 66% { transform: translate(-40px,30px) scale(0.92); } }\n  @keyframes blobFloatB { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px,50px) scale(1.15); } }\n  @keyframes blobFloatC { 0%,100% { transform: translate(0,0) scale(1); } 40% { transform: translate(40px,40px) scale(1.05); } 75% { transform: translate(-30px,-30px) scale(0.95); } }\n\n  .topbar, .container{ position:relative; z-index:1; }\n  .container{\n    max-width:1000px;\n    margin:0 auto;\n    padding:0 16px;\n  }\n\n  /* ---- Barra superior \"de c
